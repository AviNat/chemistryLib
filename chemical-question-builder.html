  <!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chemical Question Builder</title>
<!--
  Teacher tool: builds a Moodle question with the chemical keyboard (chemical-keyboard-v4.js).
  The teacher sets the student language, the element keys, the reference answer, an optional
  initial answer and the grading rubric (RUBRIC-DESIGN.md). The output is a snippet to paste into
  the Moodle question text; it is saved as a .txt file and can be opened here again.

  The saved file is the snippet itself. The configuration is in it once, as JSON in a script
  element of type application/json with the id chemkbd-...-config; opening a file reads only that block.

  Nothing in this page may contain the text of a script tag except the real tags (write it as
  "<"+"script" in code): page previewers such as htmlpreview.github.io find the scripts by
  searching for that text, and would cut the code at the wrong place.
  The student-side code in the snippet is chemkbdRun (below), copied with toString(), so the
  "Try it as a student" section runs exactly the code that Moodle will run.
-->
<script>
/*
 * MathJax (renders the keyboards' display). Its script tag is added from here, not written in the
 * page: htmlpreview.github.io loads a written script tag with a src only when the file is on GitHub;
 * any other src (MathJax on jsDelivr) is silently dropped - the display stayed plain LaTeX.
 * A tag added from a script is not touched by it.
 */
window.MathJax={tex:{inlineMath:[["\\(","\\)"]]},svg:{fontCache:"global"}};
(function(){
  var mathjax=document.createElement("script");
  mathjax.async=true;
  mathjax.src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js";
  document.head.appendChild(mathjax);
})();
</script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --text:#1d2733; --muted:#5b6876; --line:#d5dce4;

  --chip:#eef3f8; --picked:#1f5f99; --picked-text:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Arial,sans-serif}

  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px}

  touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.chips .chip.dragging{cursor:grabbing;z-index:2;box-shadow:0 3px 10px rgba(0,0,0,.2);opacity:.85}

<script>
/*
 * The keyboard library: the copy next to this page first (development: changes show at once,
 * before they are pushed), and if there is none, the public GitHub copy (the builder on the internet).
 * The builder starts only after the library has loaded (startBuilder, below).
 */
var PUBLIC_LIBRARY_URL="https://cdn.jsdelivr.net/gh/AviNat/chemistryLib@main/chemical-keyboard-v4.js";
var LIBRARY_SOURCES=[
  {url:"chemical-keyboard-v4.js",kind:"local"},
  {url:PUBLIC_LIBRARY_URL,kind:"public"}
];

function loadKeyboardLibrary(sources,done,failed){
  var script=document.createElement("script");
  script.src=sources[0].url;
  script.onload=function(){
    if(window.ChemicalKeyboard)done(sources[0]);
    else next();
  };
  script.onerror=next;
  document.head.appendChild(script);

  function next(){
    script.remove();
    if(sources.length>1)loadKeyboardLibrary(sources.slice(1),done,failed);
    else failed();
  }
}
</script>
<script>
/* ================================================================
   Student-side code. It is copied into every snippet with toString(),
   so it must stay self-contained ES5 (it runs inside Moodle).
   host: an element with an id; cfg: the question configuration.
   Returns { keyboard, feedback: [reference keyboard of the review page] } (feedback may be empty).
   ================================================================ */
function chemkbdRun(host,cfg){
  /*
   * The student language. "system": the language Moodle shows the page in, so one copy of the
   * question serves all languages - window.studentLanguage when a script on the page sets it
   * (e.g. through Moodle's multilang filter), otherwise <html lang="..."> which Moodle sets to the
   * user's current language ("he", "ar", "en", "en_us"...); anything else is English.
   */
  function supported(code){
    code=String(code||"").replace(/['"\s]/g,"").toLowerCase().slice(0,2);
    return code==="he"||code==="ar"||code==="en"?code:"";
  }
  var lang=cfg.language==="system"
    ?(supported(window.studentLanguage)||supported(document.documentElement.lang)||"en")
    :(supported(cfg.language)||"en");
  var CHECK={en:"Check the writing",he:"בדיקת הכתיבה",ar:"فحص الكتابة"};
  var WRITTEN_OK={en:"No writing problems were found.",he:"לא נמצאו בעיות בכתיבה.",ar:"لم يتم العثور على مشكلات في الكتابة."};
  var base=host.id;
  var options,keyboard,button,summary,details,referenceTitle,referenceDiv,feedback=[];

  function make(tag,suffix,css){
    var e=document.createElement(tag);
    if(suffix)e.id=base+"-"+suffix;
    if(css)e.style.cssText=css;
    return e;
  }

  /* the texts (feedback, titles) follow the student language; the formulas are always left to right */
  host.textContent="";
  host.dir=lang==="en"?"ltr":"rtl";
  var FORMULA_CSS="direction:ltr;text-align:left";

  /* ids of the parts: from the host's id, made unique if another keyboard on the page already uses them */
  if(document.getElementById(base+"-keyboard"))base+="-"+(window.__chemkbdRuns=(window.__chemkbdRuns||1)+1);

  var keyboardDiv=make("div","keyboard",FORMULA_CSS);
  keyboardDiv.dir="ltr";
  host.appendChild(keyboardDiv);

  options={
    divId:keyboardDiv.id,
    language:lang,
    mode:"edit",
    correctAnswer:cfg.correctAnswer||"",
    value:cfg.value||""
  };
  if(cfg.elementsMode==="none")options.elements=[];
  else if(cfg.elementsMode==="custom")options.elements=(cfg.elements||[]).slice();
  if(cfg.rubric)options.rubric=cfg.rubric;
  if(cfg.distinguishIsomers)options.distinguishIsomers=true;
  if(cfg.conditions===false)options.conditions=false;     // no reaction-condition (process) keys

  /*
   * Connection to the STACK question (cfg.stack). On every change the keyboard writes into inputs
   * of the same question, and hides them:
   *   scoreInput:  the score from 0 to 1 (rubric score / 100; without a rubric 1 = correct, 0 = not);
   *                the PRT gives it as the mark
   *   answerInput: the answer as value text (H_{2}O, SO_{4}^{2-}); Moodle keeps it, and the
   *                keyboard starts from it when the page is shown again
   * An empty answer empties both, so STACK sees an unanswered question.
   * STACK names its inputs "q<usage>:<slot>_ans1", so an input is found by the end of its name.
   */
  function findInput(name){
    if(!name)return null;
    var que=host.closest&&host.closest(".que");
    return (que||document).querySelector("input[name$='_"+name+"'],textarea[name$='_"+name+"']");
  }
  function setInput(field,value){
    var e,i,types=["input","change"];
    if(!field||field.value===value)return;
    field.value=value;
    for(i=0;i<types.length;i++){
      try{e=new Event(types[i],{bubbles:true});}catch(x){e=document.createEvent("Event");e.initEvent(types[i],true,true);}
      field.dispatchEvent(e);
    }
  }
  /* the model in the value notation that setValue reads (getValue() drops the sub/sup levels) */
  function valueText(chars){
    var out="",i=0,c,script,run;
    while(i<chars.length){
      c=chars[i];
      if(c.kind==="state"){out+=c.ch;i++;continue;}
      if(c.script==="sub"||c.script==="sup"){
        script=c.script;run="";
        while(i<chars.length&&chars[i].script===script&&chars[i].kind!=="state"){run+=chars[i].ch;i++;}
        out+=(script==="sub"?"_{":"^{")+run+"}";
        continue;
      }
      out+=c.ch;
      if(c.condition&&c.condition.length)out+="["+valueText(c.condition)+"]";
      i++;
    }
    return out;
  }

  /*
   * answerInput holds "answer || score% | feedback | feedback ...": the answer (read back by the
   * keyboard) and, after " || ", the feedback the student got, for Moodle's response history.
   * Quotes and backslashes are left out of the feedback (STACK string input).
   */
  var FEEDBACK_SEPARATOR=" || ";
  function savedAnswer(text){
    var i=text.indexOf(FEEDBACK_SEPARATOR);
    return i>=0?text.slice(0,i):text;
  }
  function feedbackLine(result){
    var parts=[],i,items=result.errors.concat(result.notes||[]);
    if(result.score)parts.push(result.score.total+"%");
    else if(result.correct)parts.push(ChemicalGrammar.feedbackText(lang,"correct"));
    for(i=0;i<items.length;i++){
      if(items[i].suppressedBy)continue;      // not counted: caused by another error
      if(items[i].description)parts.push(items[i].description);
    }
    return parts.join(" | ").replace(/["\\⁦-⁩]/g,"");
  }
  function compare(ast){
    return ChemicalGrammar.compare(ast,cfg.correctAnswer||"",lang,
      {rubric:cfg.rubric||null,distinguishIsomers:cfg.distinguishIsomers===true});
  }

  var stack=cfg.stack||{};
  var scoreInput=findInput(stack.scoreInput);
  var answerInput=findInput(stack.answerInput);
  if(window.console&&((stack.scoreInput&&!scoreInput)||(stack.answerInput&&!answerInput))){
    console.warn("Chemical keyboard "+base+": STACK input not found:",
      stack.scoreInput&&!scoreInput?stack.scoreInput:"",stack.answerInput&&!answerInput?stack.answerInput:"");
  }
  /* review page (after the attempt is submitted): Moodle shows the inputs read-only */
  var review=[scoreInput,answerInput].some(function(f){return f&&(f.readOnly||f.disabled);});

  if(scoreInput)scoreInput.style.display="none";
  if(answerInput){
    answerInput.style.display="none";
    if(answerInput.value)options.value=savedAnswer(answerInput.value);
  }

  /*
   * Review (after submission): the student's answer, read-only - nothing can change any more.
   * What else is shown is set in the builder (cfg.review, each true unless set to false):
   *   grade:     the score line (with a rubric) or correct / number of issues (without)
   *   reference: the reference answer, marked; when false the student's answer is not marked
   *              either, because the marking gives the answer away
   *   details:   the detailed evaluation (the penalty lines of the rubric / the list of errors)
   */
  if(review){
    var show=cfg.review||{};
    var showGrade=show.grade!==false,showReference=show.reference!==false,showDetails=show.details!==false;

    options.mode="readonly-errors";
    keyboard=new ChemicalKeyboard(options);
    if(options.value){
      var reviewResult=keyboard.compare();
      if(showReference)keyboard.setComparisonFeedback(reviewResult,"student",options.value);

      /* renderComparison fills both parts; only the parts that are switched on are put on the page */
      summary=make("div","summary","margin-top:8px;font-weight:bold");
      details=make("div","details");
      ChemicalGrammar.renderComparison(reviewResult,lang,summary,details);
      if(showGrade)host.appendChild(summary);
      if(showDetails)host.appendChild(details);

      if(showReference){
        referenceTitle=make("div",null,"font-weight:bold;margin:12px 0 4px");
        referenceTitle.textContent=ChemicalGrammar.feedbackText(lang,"referenceAnswer");
        referenceDiv=make("div","reference",FORMULA_CSS);
        referenceDiv.dir="ltr";
        host.appendChild(referenceTitle);
        host.appendChild(referenceDiv);
        feedback.push(new ChemicalKeyboard({divId:referenceDiv.id,language:lang,mode:"readonly-errors",value:""}));
        feedback[0].setComparisonFeedback(reviewResult,"reference",cfg.correctAnswer||"");
      }
    }
    return {keyboard:keyboard,feedback:feedback};
  }

  if(scoreInput||answerInput){
    options.onChange=function(r){
      var result,score;
      if(!r.model.length){
        setInput(answerInput,"");
        setInput(scoreInput,"");
        return;
      }
      result=compare(r.ast);
      score=result.score?result.score.total/100:(result.correct?1:0);
      setInput(answerInput,valueText(r.model)+FEEDBACK_SEPARATOR+feedbackLine(result));
      setInput(scoreInput,String(Math.round(score*10000)/10000));
    };
  }

  keyboard=new ChemicalKeyboard(options);

  /*
   * Check button while answering: the WRITING only - syntax errors and symbols that are not
   * elements - never the grade or anything that compares with the reference (that is for Moodle's
   * own Check and the review page). The answer is compared with itself, so the only errors left
   * are those of the writing; unbalanced atoms are left out (balancing is part of the task).
   */
  var WRITING_CODES=["syntax-error","unknown-element"];
  if(cfg.checkButton){
    button=make("button","check","margin-top:8px;padding:5px 14px;font-size:16px;cursor:pointer");
    button.type="button";
    button.textContent=CHECK[lang];
    summary=make("div","summary","margin-top:8px");
    host.appendChild(button);
    host.appendChild(summary);

    button.addEventListener("click",function(){
      var ast=keyboard.getAST(),problems=[],errors,i;
      summary.textContent="";
      if(!keyboard.getModel().length)return;
      errors=ChemicalGrammar.compare(ast,ast,lang,{}).errors;
      for(i=0;i<errors.length;i++){
        if(WRITING_CODES.indexOf(errors[i].code)>=0&&problems.indexOf(errors[i].description)<0)problems.push(errors[i].description);
      }
      if(!problems.length){
        summary.style.color="#18742a";
        summary.textContent=WRITTEN_OK[lang];
        return;
      }
      summary.style.color="#a12622";
      for(i=0;i<problems.length;i++){
        var line=document.createElement("div");
        line.textContent=problems[i];
        summary.appendChild(line);
      }
    });
  }

  return {keyboard:keyboard,feedback:feedback};
}

/* ================================================================
   Rubric: editor rows <-> library format
   rule in the editor: { mode: "none" | "once" | "each", value, max, allMissing }
   ================================================================ */
function rubricRulesFrom(rubric){
  const rules={};
  RUBRIC_CATEGORIES.forEach(category=>{
    const r=rubric?rubric[category]:undefined;
    if(typeof r==="number") rules[category]={mode:"once",value:r,max:"",allMissing:""};
    else if(r&&typeof r==="object") rules[category]={
      mode:"each",
      value:Number(r.each)||0,
      max:r.max!==undefined?r.max:"",
      allMissing:r.allMissing!==undefined?r.allMissing:""
    };
    else rules[category]={mode:"none",value:10,max:"",allMissing:""};
  });
  return rules;
}

function rubricForLibrary(){
  if(!state.rubricEnabled) return null;
  const rubric={};
  RUBRIC_CATEGORIES.forEach(category=>{
    const rule=state.rubric[category];
    if(rule.mode==="once") rubric[category]=clampPercent(rule.value);
    else if(rule.mode==="each"){
      const r={each:clampPercent(rule.value)};
      if(rule.max!==""&&rule.max!==null) r.max=clampPercent(rule.max);
      if(PER_ERROR_ONLY_EXTRA[category]&&rule.allMissing!==""&&rule.allMissing!==null) r.allMissing=clampPercent(rule.allMissing);
      rubric[category]=r;
    }
  });
  return rubric;
}

function clampPercent(v){
  const n=Number(v);
  if(!isFinite(n)) return 0;
  return Math.max(0,Math.min(100,n));
}

function questionConfig(){
  const cfg={
    tool:FILE_TOOL,
    formatVersion:FILE_VERSION,
    questionId:state.questionId,

    language:state.language,
    elementsMode:state.elementsMode,
    correctAnswer:state.correctAnswer,
    value:state.value,
    checkButton:state.checkButton,
    review:{grade:state.reviewGrade,reference:state.reviewReference,details:state.reviewDetails}
  };
  /* always written, also when empty: an emptied field must stay empty when the file is opened again */
  cfg.stack={scoreInput:state.stackScoreInput,answerInput:state.stackAnswerInput};
  if(state.elementsMode==="custom") cfg.elements=state.elements.slice();
  if(state.distinguishIsomers) cfg.distinguishIsomers=true;
  if(!state.conditions) cfg.conditions=false;
  const rubric=rubricForLibrary();
  if(rubric) cfg.rubric=rubric;
  return cfg;
}

function applyConfig(cfg){
  const s=newState();
  if(typeof cfg.questionId==="string") s.questionId=cfg.questionId;
  if(typeof cfg.libraryUrl==="string"&&cfg.libraryUrl&&!/^file:/i.test(cfg.libraryUrl)) s.libraryUrl=cfg.libraryUrl;
  if(["system","he","ar","en"].indexOf(cfg.language)>=0) s.language=cfg.language;
  if(["default","custom","none"].indexOf(cfg.elementsMode)>=0) s.elementsMode=cfg.elementsMode;
  if(Array.isArray(cfg.elements)) s.elements=cfg.elements.filter(e=>ALL_ELEMENTS.indexOf(e)>=0);
  s.correctAnswer=typeof cfg.correctAnswer==="string"?cfg.correctAnswer:"";
  s.value=typeof cfg.value==="string"?cfg.value:"";
  s.distinguishIsomers=cfg.distinguishIsomers===true;
  s.conditions=cfg.conditions!==false;
  s.checkButton=cfg.checkButton!==false;
  const review=cfg.review||{};     // files from before these options: all shown
  s.reviewGrade=review.grade!==false;
  s.reviewReference=review.reference!==false;
  s.reviewDetails=review.details!==false;
  if(cfg.stack){      // files from before the STACK fields keep the defaults (ans1, ans2)
    s.stackScoreInput=typeof cfg.stack.scoreInput==="string"?cfg.stack.scoreInput:"";
    s.stackAnswerInput=typeof cfg.stack.answerInput==="string"?cfg.stack.answerInput:"";
  }
  s.rubricEnabled=!!cfg.rubric;
  s.rubric=rubricRulesFrom(cfg.rubric||SAMPLE_RUBRIC);
  state=s;
}

/* the script tags of the snippet, built from parts (see the note at the top of this page) */
const SCRIPT_OPEN="<"+"script";
const SCRIPT_CLOSE="<"+"/script>";

function snippet(){
  const id=configId();
  const json=JSON.stringify(questionConfig(),null,1).replace(/</g,"\\u003c");
  return [
    "<!-- Chemical keyboard question \""+state.questionId+"\" (code version "+SNIPPET_VERSION+"). Created with the chemical keyboard question builder:",
    "     to change it, open the saved file in the builder. Do not edit by hand. -->",
    "<div id=\""+id+"\"></div>",
    SCRIPT_OPEN+" type=\"application/json\" id=\""+id+"-config\">"+json+SCRIPT_CLOSE,
    SCRIPT_OPEN+">",
    "(function(){",
    "var HOST_ID="+JSON.stringify(id)+",LIBRARY_URL="+JSON.stringify(state.libraryUrl)+";",
    "var SCRIPT=document.currentScript;",
    chemkbdRun.toString(),
    "/* this copy's own element with the given id: the nearest one before this script (another copy of the code may use the same id) */",
    "function own(id){",
    "  for(var e=SCRIPT&&SCRIPT.previousElementSibling;e;e=e.previousElementSibling){if(e.id===id)return e;}",
    "  return document.getElementById(id);",
    "}",
    "/* the STACK inputs come after this code in the question text: start only when the whole page is read */",
    "function start(){",
    "  if(document.readyState===\"loading\"){document.addEventListener(\"DOMContentLoaded\",start);return;}",
    "  var copies=document.querySelectorAll(\"[id='\"+HOST_ID+\"']\").length;",
    "  if(copies>1&&window.console)console.warn(\"[chemkbd \"+HOST_ID+\"] \"+copies+\" keyboards on this page have the id \"+HOST_ID+\": the code was pasted more than once, or two questions have the same question id\");",
    "  try{chemkbdRun(own(HOST_ID),JSON.parse(own(HOST_ID+\"-config\").textContent));}",
    "  catch(e){if(window.console)console.error(\"[chemkbd \"+HOST_ID+\"] failed:\",e);}",
    "}",
    "/* the library is loaded once for all the keyboard questions on the page */",
    "if(window.ChemicalKeyboard){start();return;}",
    "var queue=window.__chemkbdQueue=window.__chemkbdQueue||[];",
    "queue.push(start);",
    "if(window.__chemkbdLoading)return;",
    "window.__chemkbdLoading=true;",
    "var script=document.createElement(\"script\");",
    "script.src=LIBRARY_URL;",
    "script.onload=function(){while(queue.length)queue.shift()();};",
    "script.onerror=function(){if(window.console)console.error(\"[chemkbd \"+HOST_ID+\"] the library could not be loaded:\",LIBRARY_URL);};",
    "document.head.appendChild(script);",
    "})();",
    SCRIPT_CLOSE
  ].join("\n");
}

/* Reads the configuration back from a saved snippet (or a plain JSON file). */
function parseFile(text){
  let json=null;
  const match=new RegExp(SCRIPT_OPEN+"[^>]*type=[\"']application/json[\"'][^>]*>([\\s\\S]*?)"+SCRIPT_CLOSE,"i").exec(text);
  if(match) json=match[1];
  else if(/^\s*\{/.test(text)) json=text;
  if(!json) throw new Error("no configuration");
  const cfg=JSON.parse(json);
  if(!cfg||cfg.tool!==FILE_TOOL) throw new Error("not a builder file");
  return cfg;
}

/* ================================================================
   Keyboards
   ================================================================ */
function removeKeyboard(keyboard){
  if(!keyboard) return;
  [keyboard.root,keyboard.elementPanel,keyboard.atomPanel].forEach(el=>{
    if(el&&el.parentNode) el.parentNode.removeChild(el);
  });
}

function keyboardElements(){
  if(state.elementsMode==="none") return [];
  if(state.elementsMode==="custom") return state.elements.slice();
  return undefined;
}

/* Only one keyboard window open at a time: opening one closes the others. */
function openKeyboards(){
  return [referenceKeyboard,initialKeyboard,tryRun&&tryRun.keyboard].filter(Boolean);
}
function oneWindowAtATime(keyboard){
  const show=keyboard.show;
  keyboard.show=function(){
    openKeyboards().forEach(other=>{ if(other!==keyboard) other.hide(); });
    return show.apply(keyboard,arguments);
  };
}

/*
 * Keyboard model -> the value text that setValue reads (H_{2}O, SO_{4}^{2-}, NaCl(aq), →[Δ]).
 * getValue() cannot be used: it drops the sub/sup levels (2H_{2}O comes back as ₂H₂O).
 * Same as showChars in chemTests.js, whose setValue cases check the round trip.
 */
function modelToValue(chars){
  let out="";
  let i=0;
  while(i<chars.length){
    const c=chars[i];
    if(c.kind==="state"){ out+=c.ch; i+=1; continue; }
    if(c.script==="sub"||c.script==="sup"){
      const script=c.script;
      let run="";
      while(i<chars.length&&chars[i].script===script&&chars[i].kind!=="state"){ run+=chars[i].ch; i+=1; }
      out+=(script==="sub"?"_{":"^{")+run+"}";
      continue;
    }
    out+=c.ch;
    if(c.condition&&c.condition.length) out+="["+modelToValue(c.condition)+"]";
    i+=1;
  }
  return out;
}

function makeEditor(hostId,value,onValue){
  const options={divId:hostId,language:previewLanguage(),mode:"edit",value:value,
    onChange:r=>{ if(!building) onValue(modelToValue(r.model)); }};
  const elements=keyboardElements();
  if(elements) options.elements=elements;
  if(!state.conditions) options.conditions=false;
  const keyboard=new ChemicalKeyboard(options);
  oneWindowAtATime(keyboard);
  return keyboard;
}

function buildKeyboards(){
  building=true;
  removeKeyboard(referenceKeyboard);
  removeKeyboard(initialKeyboard);
  referenceKeyboard=makeEditor("referenceHost",state.correctAnswer,v=>{
    state.correctAnswer=v; clearReferenceCheck(); changed({try:"sync"});
  });
  initialKeyboard=makeEditor("initialHost",state.value,v=>{
    state.value=v; changed(); buildTry();   // the student starts from the initial answer
  });
  building=false;
  buildTry();
}

function buildTry(){
  if(tryRun){
    removeKeyboard(tryRun.keyboard);
    tryRun.feedback.forEach(removeKeyboard);
  }
  const cfg=questionConfig();
  cfg.checkButton=true;      // the teacher always gets the check button here
  delete cfg.stack;          // no STACK inputs on this page
  cfg.language=previewLanguage();
  building=true;
  tryRun=chemkbdRun($("tryHost"),cfg);
  building=false;
  oneWindowAtATime(tryRun.keyboard);
}

/* Reference answer / rubric / isomers changed: the "try" keyboard checks against the new values. */
function syncTry(){
  if(!tryRun) return;
  const keyboard=tryRun.keyboard;
  keyboard.setCorrectAnswer(state.correctAnswer);
  keyboard.setRubric(rubricForLibrary());
  keyboard.config.distinguishIsomers=state.distinguishIsomers;
}

function elementPosition(z){   // [row, column]; rows 9 and 10 are the f-block
  if(z===1) return [1,1];
  if(z===2) return [1,18];
  if(z<=10) return [2,z<=4?z-2:z+8];
  if(z<=18) return [3,z<=12?z-10:z];
  if(z<=36) return [4,z-18];
  if(z<=54) return [5,z-36];
  if(z<=56) return [6,z-54];
  if(z<=71) return [9,z-54];
  if(z<=86) return [6,z-68];
  if(z<=88) return [7,z-86];
  if(z<=103) return [10,z-86];
  return [7,z-100];
}

function toggleElement(symbol){

  else state.elements.push(symbol);

function addElements(list){

}

function renderElements(){
  document.querySelectorAll("input[name=elementsMode]").forEach(r=>{ r.checked=r.value===state.elementsMode; });

/*
 * A chip: a click removes the element; a drag moves it. Pointer events, not the browser's drag
 * and drop: they work the same with a mouse and a finger (tablets), and the drop may be anywhere
 * in the list - the marker shows where the element goes. Removing is on "click" (also sent by
 * assistive tools); the click the browser may send at the end of a drag is ignored.
 */
function chipPointer(chip,symbol,index){
  let justDragged=false;
  chip.addEventListener("click",()=>{
    if(justDragged){ justDragged=false; return; }
    toggleElement(symbol);
  });
  chip.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    const startX=e.clientX,startY=e.clientY;
    let dragging=false,target=null;
    chip.setPointerCapture(e.pointerId);

    const move=ev=>{
      if(!dragging&&Math.hypot(ev.clientX-startX,ev.clientY-startY)>5){
        dragging=true;
        chip.classList.add("dragging");
      }
      if(!dragging) return;
      chip.style.transform="translate("+(ev.clientX-startX)+"px,"+(ev.clientY-startY)+"px)";
      target=chipDropIndex(chip,ev.clientX,ev.clientY);
      chipDropMarker(chip,target);
    };
    const end=ev=>{
      chip.removeEventListener("pointermove",move);
      chip.removeEventListener("pointerup",end);
      chip.removeEventListener("pointercancel",end);
      if(!dragging) return;                                  // a click: handled by the click listener
      justDragged=true;
      setTimeout(()=>{ justDragged=false; },0);              // only the click that follows at once
      chip.classList.remove("dragging");
      chip.style.transform="";
      chipDropMarker(chip,null);
      if(target===null||ev.type!=="pointerup") return;
      state.elements.splice(index,1);
      state.elements.splice(target,0,symbol);
      elementsChanged();
    };
    chip.addEventListener("pointermove",move);
    chip.addEventListener("pointerup",end);
    chip.addEventListener("pointercancel",end);
  });
}

/* Where the dragged chip goes: its index in the list without it, from the pointer position (reading order, left to right). */
function chipDropIndex(dragged,x,y){
  const others=[...$("chips").querySelectorAll(".chip")].filter(c=>c!==dragged);
  for(let i=0;i<others.length;i++){
    const r=others[i].getBoundingClientRect();
    if(y<r.top) return i;                                   // a row above this chip
    if(y<=r.bottom&&x<r.left+r.width/2) return i;           // this row, left of the chip's middle
  }
  return others.length;                                     // after the last chip
}

/* The marker: a bar before the chip the dragged one will be put before (or after the last chip). */
function chipDropMarker(dragged,target){
  const others=[...$("chips").querySelectorAll(".chip")].filter(c=>c!==dragged);
  others.forEach((c,i)=>{
    c.classList.toggle("drop-before",target===i);
    c.classList.toggle("drop-after",target===others.length&&i===others.length-1);
  });
}

/* Element symbols in an answer (reaction conditions in [...] and states are skipped). */
function elementsIn(value){
  const text=(value||"").replace(/\[[^\]]*\]/g," ").replace(/\((s|l|g|aq)\)/g," ");
  const found=[];
  const re=/[A-Z][a-z]?/g;
  let m;
  while((m=re.exec(text))){
    let symbol=m[0];
    if(ALL_ELEMENTS.indexOf(symbol)<0&&symbol.length===2){
      symbol=symbol[0];
      re.lastIndex-=1;
    }
    if(ALL_ELEMENTS.indexOf(symbol)>=0&&found.indexOf(symbol)<0) found.push(symbol);
  }
  return found;
}

function panelElements(){
  if(state.elementsMode==="default") return DEFAULT_ELEMENTS;
  if(state.elementsMode==="custom") return state.elements;
  return null;      // none: the student always uses the full list, nothing to report
}

/* ================================================================
   Rubric editor
   ================================================================ */
function renderRubric(){
  $("useRubric").checked=state.rubricEnabled;
  $("rubricBody").classList.toggle("disabled",!state.rubricEnabled);

  /*
   * One row per category, one column per value: how it is counted | penalty | maximum | no states at all.
   * A value that does not apply to the chosen way of counting shows "—"; "no states at all" exists only for states.
   */
  const body=$("rubricRows");
  body.textContent="";
  RUBRIC_CATEGORIES.forEach(category=>{
    const rule=state.rubric[category];
    const tr=document.createElement("tr");
    if(rule.mode==="none") tr.className="off";

    const name=document.createElement("td");
    name.className="category";
    name.textContent=t("cat")[category];
    tr.appendChild(name);

    const modeCell=document.createElement("td");
    const mode=document.createElement("select");
    [["none","ruleNone"],["once","ruleOnce"],["each","ruleEach"]].forEach(([value,key])=>{
      const o=document.createElement("option");
      o.value=value;
      o.textContent=t(key);
      mode.appendChild(o);
    });
    mode.value=rule.mode;
    mode.addEventListener("change",()=>{ rule.mode=mode.value; renderRubric(); rubricChanged(); });
    modeCell.appendChild(mode);
    tr.appendChild(modeCell);

    tr.appendChild(valueCell(rule.mode!=="none"?percentInput(rule,"value",false):null));
    tr.appendChild(valueCell(rule.mode==="each"?percentInput(rule,"max",true,t("noLimit")):null));
    tr.appendChild(valueCell(
      rule.mode==="each"&&PER_ERROR_ONLY_EXTRA[category]?percentInput(rule,"allMissing",true,t("noLimit")):null,
      !PER_ERROR_ONLY_EXTRA[category]));

    body.appendChild(tr);
  });
}

/* A table cell with a value, "—" when it does not apply now, or nothing when it never applies to the category. */
function valueCell(content,never){
  const td=document.createElement("td");
  td.className="value";
  if(content) td.appendChild(content);
  else if(!never){
    const na=document.createElement("span");
    na.className="na";
    na.textContent="—";
    td.appendChild(na);
  }
  return td;
}

/* The number and its "%" in a left-to-right box, so the "%" is on the right in every language. */
function percentInput(rule,key,optional,placeholder){
  const box=document.createElement("span");
  box.className="pct";
  box.dir="ltr";
  const input=document.createElement("input");
  input.type="number";
  input.min="0";
  input.max="100";
  input.step="1";
  if(placeholder) input.placeholder=placeholder;
  input.value=rule[key];
  input.addEventListener("input",()=>{
    rule[key]=input.value===""&&optional?"":clampPercent(input.value);
    rubricChanged();
  });
  box.appendChild(input);
  box.appendChild(document.createTextNode("%"));
  return box;
}

function rubricChanged(){ changed({try:"sync"}); }

/* ================================================================
   Checks, output, file state
   ================================================================ */
function renderReferenceStatus(){
  const status=$("referenceStatus");
  status.textContent="";
  status.className="status";

  if(!state.correctAnswer){
    status.textContent=t("referenceEmpty");
    status.classList.add("bad");
    return;
  }

  const problems=referenceProblems();
  if(problems.length){
    status.classList.add("bad");
    const ul=document.createElement("ul");
    problems.forEach(p=>{ const li=document.createElement("li"); li.textContent=p; ul.appendChild(li); });
    status.appendChild(document.createTextNode(t("issueReference")));
    status.appendChild(ul);
    return;
  }

  status.classList.add("ok");
  status.appendChild(document.createTextNode(t("referenceOk")));
}

/*
 * "Check the reference answer": the full check of the reference on its own - syntax, unknown
 * elements and, for an equation, the balance of each atom. The reference is compared with itself,
 * so the only errors left are those of the answer itself; the problem parts are marked on a
 * read-only copy, as in the student's feedback.
 */
const REFERENCE_CHECK_CODES=["syntax-error","unknown-element","unbalanced-atom"];

function checkReference(){
  const box=$("referenceCheck");
  const view=$("referenceCheckView");
  clearReferenceCheck();

  if(!state.correctAnswer){
    box.className="status bad";
    box.textContent=t("referenceEmpty");
    return;
  }

  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,teacherLanguage,
    {distinguishIsomers:state.distinguishIsomers});
  const problems=result.errors.filter(e=>REFERENCE_CHECK_CODES.indexOf(e.code)>=0);
  const texts=[];
  problems.forEach(e=>{ if(texts.indexOf(e.description)<0) texts.push(e.description); });

  if(!texts.length){
    box.className="status ok";
    box.textContent=t(/[→⇌]/.test(state.correctAnswer)?"referenceBalanced":"referenceFormulaOk");
    return;
  }

  box.className="status bad";
  box.appendChild(document.createTextNode(t("referenceProblemsTitle")));
  const ul=document.createElement("ul");
  texts.forEach(text=>{ const li=document.createElement("li"); li.textContent=text; ul.appendChild(li); });
  box.appendChild(ul);

  const marked=new ChemicalKeyboard({divId:"referenceCheckView",language:previewLanguage(),mode:"readonly-errors",value:""});
  marked.setComparisonFeedback(Object.assign({},result,{errors:problems}),"student",referenceKeyboard.getModel());
  view.style.display="";
}

/* The check shows one version of the reference; it is cleared when the reference changes. */
function clearReferenceCheck(){
  $("referenceCheck").textContent="";
  $("referenceCheck").className="status";
  $("referenceCheckView").textContent="";
}

/*
 * The elements of the reference answer, each marked "on the panel" or "only in the full list"
 * (as a chip, and on the periodic table). Follows the reference answer as it is typed.
 */
function renderReferenceElements(){
  const used=elementsIn(state.correctAnswer);
  const onPanel=panelElements()||[];
  const box=$("refElements");

  box.textContent="";
  if(!used.length){
    const none=document.createElement("span");
    none.className="empty";
    none.textContent=t("refElementsNone");
    box.appendChild(none);
  }
  used.forEach(symbol=>{
    const chip=document.createElement("span");
    chip.className="chip "+(onPanel.indexOf(symbol)>=0?"on-panel":"full-list");
    chip.textContent=symbol;
    chip.title=t(onPanel.indexOf(symbol)>=0?"legendOnPanel":"legendFullList");
    box.appendChild(chip);
  });

  $("addFromReference").disabled=!used.some(symbol=>onPanel.indexOf(symbol)<0);

  document.querySelectorAll("#periodic button").forEach(b=>{
    b.classList.toggle("in-reference",used.indexOf(b.dataset.symbol)>=0);
  });
}

/* Syntax errors and unknown elements of the reference answer, in the teacher's language. */
function referenceProblems(){
  if(!state.correctAnswer) return [];
  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,teacherLanguage,{});
  const texts=[];
  result.errors.forEach(e=>{
    if((e.code==="syntax-error"||e.code==="unknown-element")&&texts.indexOf(e.description)<0) texts.push(e.description);
  });
  return texts;
}

function renderIssues(){
  const issues=[];
  if(!/^[A-Za-z0-9_-]+$/.test(state.questionId)) issues.push(t("issueId"));
  const stackNames=[state.stackScoreInput,state.stackAnswerInput].filter(Boolean);
  if(stackNames.some(name=>!/^[A-Za-z][A-Za-z0-9_]*$/.test(name))) issues.push(t("issueStackName"));
  if(stackNames.length===2&&stackNames[0]===stackNames[1]) issues.push(t("issueStackSame"));
  if(!state.libraryUrl.trim()) issues.push(t("issueUrl"));
  if(!state.correctAnswer) issues.push(t("referenceEmpty"));
  if(!state.conditions&&/[→⇌]\[/.test(state.correctAnswer)) issues.push(t("issueConditions"));
  else if(referenceProblems().length) issues.push(t("issueReference"));
  const info=[];
  if(state.rubricEnabled&&RUBRIC_CATEGORIES.every(c=>state.rubric[c].mode==="none")) info.push(t("issueNoPenalty"));

  const box=$("issues");
  box.textContent="";
  box.className="status";
  if(!issues.length&&!info.length){
    box.classList.add("ok");
    box.textContent=t("ready");
    return;
  }
  if(issues.length) box.appendChild(document.createTextNode(t("issuesTitle")));
  const ul=document.createElement("ul");
  issues.forEach(text=>{ const li=document.createElement("li"); li.textContent=text; ul.appendChild(li); });
  info.forEach(text=>{ const li=document.createElement("li"); li.className="info"; li.textContent=text; ul.appendChild(li); });
  box.appendChild(ul);
}

function renderOutput(){
  $("output").value=snippet();
  $("copyStatus").textContent="";
  renderStackModels();
}

/*
 * Model answers for the STACK inputs, to copy into the STACK question:
 *   score input:  1
 *   answer input: what it holds for a correct answer - the reference, " || ", and its feedback
 *                 (same format and language as chemkbdRun writes: savedAnswer / feedbackLine there),
 *                 as a quoted string, because it is a String input.
 */
function stackModelAnswer(){
  /* with "system" the feedback text is in the preview language: STACK never compares with it, it only needs a model answer */
  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,previewLanguage(),
    {rubric:rubricForLibrary(),distinguishIsomers:state.distinguishIsomers});
  const parts=[];
  if(result.score) parts.push(result.score.total+"%");
  else if(result.correct) parts.push(ChemicalGrammar.feedbackText(previewLanguage(),"correct"));
  result.errors.concat(result.notes||[]).forEach(e=>{ if(!e.suppressedBy&&e.description) parts.push(e.description); });
  const feedback=parts.join(" | ").replace(/["\\\u2066-\u2069]/g,"");
  return "\""+state.correctAnswer.replace(/["\\]/g,"")+" || "+feedback+"\"";
}

function renderStackModels(){
  const box=$("stackModels");
  box.textContent="";
  const rows=[];
  if(state.stackScoreInput) rows.push([state.stackScoreInput,"1"]);
  if(state.stackAnswerInput&&state.correctAnswer) rows.push([state.stackAnswerInput,stackModelAnswer()]);

  rows.forEach(([name,value])=>{
    const row=document.createElement("div");
    row.className="model-row";
    const label=document.createElement("span");
    label.className="label";
    label.textContent=t("modelFor").replace("{name}",name);
    const field=document.createElement("input");
    field.type="text";
    field.readOnly=true;
    field.value=value;
    field.addEventListener("focus",()=>field.select());
    const copy=document.createElement("button");
    copy.type="button";
    copy.textContent=t("copy");
    copy.addEventListener("click",()=>{
      field.select();
      const done=()=>{ copy.textContent=t("copied"); setTimeout(()=>{ copy.textContent=t("copy"); },1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(value).then(done,()=>{ document.execCommand("copy"); done(); });
      else { document.execCommand("copy"); done(); }
    });
    row.appendChild(label);
    row.appendChild(field);
    row.appendChild(copy);
    box.appendChild(row);
  });
}

function renderFileState(){
  $("fileName").textContent=fileName||t("untitled");
  $("dirtyMark").textContent=dirty?t("unsaved"):"";
}

function changed(options){
  dirty=true;
  if(options&&options.try==="sync") syncTry();
  renderReferenceStatus();
  renderReferenceElements();
  renderIssues();
  renderOutput();
  renderFileState();
}

/* ================================================================
   Whole page
   ================================================================ */
function renderTexts(){
  document.documentElement.lang=teacherLanguage;
  document.documentElement.dir=teacherLanguage==="en"?"ltr":"rtl";
  document.title=t("appTitle");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent=t(el.dataset.t); });
  $("teacherLanguage").value=teacherLanguage;
  $("librarySource").textContent=t(librarySource.kind==="local"?"libraryLocal":"libraryPublic");
  $("librarySource").style.color=librarySource.kind==="local"?"var(--warn)":"";
}

function renderSettings(){
  $("studentLanguage").value=state.language;
  $("languageSystemHint").style.display=state.language==="system"?"":"none";
  $("questionId").value=state.questionId;
  $("libraryUrl").value=state.libraryUrl;
  $("distinguishIsomers").checked=state.distinguishIsomers;
  $("conditions").checked=state.conditions;
  $("checkButton").checked=state.checkButton;
  $("reviewGrade").checked=state.reviewGrade;
  $("reviewReference").checked=state.reviewReference;

function renderAll(){
  clearReferenceCheck();    // its texts are in the teacher's language; press the button again
  renderTexts();
  renderSettings();
  renderElements();
  renderRubric();
  renderReferenceStatus();
  renderIssues();
  renderOutput();
  renderFileState();
}

function loadState(cfg,name,handle){
  if(cfg) applyConfig(cfg); else state=newState();
  fileName=name||null;
  fileHandle=handle||null;
  dirty=false;
  buildKeyboards();
  renderAll();
}

/* ================================================================
   Files
   ================================================================ */
function confirmDiscard(){
  return !dirty||window.confirm(t("confirmDiscard"));
}

function openText(text,name,handle){
  let cfg;
  try{ cfg=parseFile(text); }
  catch(e){ window.alert(t("openError")); return; }
  loadState(cfg,name,handle);
}

async function openFile(){
  if(!confirmDiscard()) return;
  if(window.showOpenFilePicker){
    try{
      const [handle]=await window.showOpenFilePicker({types:[{description:"Text",accept:{"text/plain":[".txt"]}}]});
      const file=await handle.getFile();
      openText(await file.text(),file.name,handle);
    }catch(e){ if(e.name!=="AbortError") window.alert(t("openError")); }
    return;
  }
  $("fileInput").value="";
  $("fileInput").click();
}

async function saveFile(saveAs){
  const text=snippet();
  const suggested=fileName||(state.questionId||"question")+".txt";

  if(window.showSaveFilePicker){
    try{
      let handle=saveAs?null:fileHandle;
      if(!handle) handle=await window.showSaveFilePicker({suggestedName:suggested,types:[{description:"Text",accept:{"text/plain":[".txt"]}}]});
      const writable=await handle.createWritable();
      await writable.write(text);
      await writable.close();
      fileHandle=handle;
      fileName=handle.name;
      dirty=false;
      renderFileState();
    }catch(e){ if(e.name!=="AbortError") window.alert(e.message); }
    return;
  }

  /* No file system access: download the file. */
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=suggested;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  fileName=suggested;
  dirty=false;
  renderFileState();
}

document.querySelectorAll("input[name=elementsMode]").forEach(radio=>{
  radio.addEventListener("change",()=>{
    if(!radio.checked) return;
    state.elementsMode=radio.value;
    if(state.elementsMode==="custom"&&!state.elements.length) state.elements=DEFAULT_ELEMENTS.slice();
    elementsChanged();
  });
});
/* From the default set or "none" this switches to a custom panel: the current panel plus the missing elements. */
$("addFromReference").addEventListener("click",()=>{
  if(state.elementsMode!=="custom") state.elements=(panelElements()||[]).slice();
  state.elementsMode="custom";
  addElements(elementsIn(state.correctAnswer));
  elementsChanged();
});
$("startFromDefault").addEventListener("click",()=>{ state.elements=DEFAULT_ELEMENTS.slice(); elementsChanged(); });
$("clearElements").addEventListener("click",()=>{ state.elements=[]; elementsChanged(); });

$("copyFromReference").addEventListener("click",()=>{ initialKeyboard.setValue(state.correctAnswer); });
$("clearInitial").addEventListener("click",()=>{ initialKeyboard.setValue(""); });

$("useRubric").addEventListener("change",e=>{ state.rubricEnabled=e.target.checked; renderRubric(); rubricChanged(); });

$("restartTry").addEventListener("click",buildTry);

$("copyOutput").addEventListener("click",()=>{
  const area=$("output");
  area.select();
  const done=()=>{ $("copyStatus").textContent=t("copied"); };
  if(navigator.clipboard) navigator.clipboard.writeText(area.value).then(done,()=>{ document.execCommand("copy"); done(); });
  else { document.execCommand("copy"); done(); }
});

$("newBtn").addEventListener("click",()=>{ if(confirmDiscard()) loadState(null); });
$("openBtn").addEventListener("click",openFile);

$("fileInput").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  file.text().then(text=>openText(text,file.name,null));
});

window.addEventListener("beforeunload",e=>{
  if(dirty){ e.preventDefault(); e.returnValue=""; }
});

/* ================================================================
   Start
   ================================================================ */
buildPeriodicTable();
loadState(null);
}
