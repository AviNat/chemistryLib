<title>Chemical Question Builder</title>
<!--
  Teacher tool: builds a Moodle question with the chemical keyboard (chemical-keyboard-v4.js).
  The teacher sets the student language, the element keys, the reference answer, an optional
  initial answer and the grading rubric (RUBRIC-DESIGN.md). The output is a snippet to paste into
  the Moodle question text; it is saved as a .txt file and can be opened here again.

  The saved file is the snippet itself. The configuration is in it once, as JSON in
  <script type="application/json" id="chemkbd-...-config">; opening a file reads only that block.
  The student-side code in the snippet is chemkbdRun (below), copied with toString(), so the
  "Try it as a student" section runs exactly the code that Moodle will run.
-->

#dirtyMark{color:var(--warn);font-size:13px}
main{max-width:1000px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}

.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}

label.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
label.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
input[type=text],input[type=url],select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}

#libraryUrl{width:min(560px,90vw);direction:ltr}
button{font:inherit;padding:5px 12px;border:1px solid #9fb0c2;border-radius:6px;background:#fff;color:var(--text);cursor:pointer}

button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.periodic button{padding:4px 0;font-size:13px;min-width:0;border-radius:4px}
.periodic button.picked{background:var(--picked);border-color:var(--picked);color:var(--picked-text)}
.periodic .gap{grid-column:1/-1;height:6px}
.chips{direction:ltr;display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:6px;border:1px dashed var(--line);border-radius:8px}
.chips .chip{padding:4px 10px;background:var(--chip);border:1px solid #b9c7d6;border-radius:14px;cursor:grab}
.chips .chip.dragging{opacity:.4}
.chips .empty{color:var(--muted);font-size:13px;align-self:center}
.chips.inline{display:inline-flex;min-height:0;padding:0;border:0;vertical-align:middle}
.chip.on-panel,.chip.full-list{padding:2px 9px;border-radius:12px;font-size:14px;cursor:default;direction:ltr;display:inline-block}
.chip.on-panel{background:#dcf1e1;border:1px solid #7cc08f;color:#14532d}
.chip.full-list{background:#fff4dc;border:1px dashed #d19a2a;color:#7a4b00}
.ref-elements{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;font-weight:bold}
.ref-elements button{font-weight:normal}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend .chip{font-size:11px;padding:0 6px}
.periodic button.in-reference{outline:2px dashed #d19a2a;outline-offset:1px}
.periodic button.in-reference.picked{outline:2px solid #7cc08f}
.disabled{opacity:.45;pointer-events:none}
.kbd-host{max-width:820px}
.status{margin-top:8px;font-size:14px}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.info{color:var(--muted)}
.rubric-scroll{overflow-x:auto}
table.rubric{border-collapse:collapse;width:100%;min-width:620px}
table.rubric th,table.rubric td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:middle}

table.rubric td.value{white-space:nowrap;text-align:center}

#issues li{color:var(--bad)}

<script>
/* ================================================================
   Student-side code. It is copied into every snippet with toString(),
   so it must stay self-contained ES5 (it runs inside Moodle).
   host: an element with an id; cfg: the question configuration.
   Returns { keyboard, feedback: [student, reference] } (feedback may be empty).
   ================================================================ */
function chemkbdRun(host,cfg){
  var lang=cfg.language==="he"||cfg.language==="ar"?cfg.language:"en";
  var CHECK={en:"Check",he:"בדיקה",ar:"تحقق"};
  var base=host.id;
  var options,input=null,keyboard,que,button,summary,details,section,studentTitle,studentDiv,referenceTitle,referenceDiv,feedback=[];

  function make(tag,suffix,css){
    var e=document.createElement(tag);
    if(suffix)e.id=base+"-"+suffix;
    if(css)e.style.cssText=css;
    return e;
  }

  host.textContent="";
  host.dir=lang==="en"?"ltr":"rtl";

  var keyboardDiv=make("div","keyboard");
  host.appendChild(keyboardDiv);

  options={
    divId:keyboardDiv.id,
    language:lang,
    mode:"edit",
    correctAnswer:cfg.correctAnswer||"",
    value:cfg.value||""
  };
  if(cfg.elementsMode==="none")options.elements=[];
  else if(cfg.elementsMode==="custom")options.elements=(cfg.elements||[]).slice();
  if(cfg.rubric)options.rubric=cfg.rubric;
  if(cfg.distinguishIsomers)options.distinguishIsomers=true;

  /*
   * The keyboard writes the student's answer into the question's own answer box (hidden).
   * It is stored as the keyboard model (JSON): getValue() text loses subscripts and
   * charges (2H2O reads back as ₂H₂O), the model reads back exactly.
   */
  if(cfg.answerField){
    que=host.closest?host.closest(".que"):null;
    input=que?que.querySelector("input[type=text],textarea"):null;
    if(input){
      input.style.display="none";
      if(input.value){
        try{options.value=JSON.parse(input.value);}catch(e){options.value=input.value;}
      }
      options.onChange=function(r){input.value=r.model.length?JSON.stringify(r.model):"";};
    }
  }

  keyboard=new ChemicalKeyboard(options);

  if(cfg.checkButton){
    button=make("button","check","margin-top:8px;padding:5px 14px;font-size:16px;cursor:pointer");
    button.type="button";
    button.textContent=CHECK[lang];
    summary=make("div","summary","margin-top:8px;font-weight:bold");
    details=make("div","details");
    section=make("div","feedback","display:none;margin-top:12px");
    studentTitle=make("div",null,"font-weight:bold;margin:8px 0 4px");
    studentDiv=make("div","student");
    referenceTitle=make("div",null,"font-weight:bold;margin:8px 0 4px");
    referenceDiv=make("div","reference");

    section.appendChild(studentTitle);
    section.appendChild(studentDiv);
    section.appendChild(referenceTitle);
    section.appendChild(referenceDiv);
    host.appendChild(button);
    host.appendChild(summary);
    host.appendChild(details);
    host.appendChild(section);

    feedback.push(new ChemicalKeyboard({divId:studentDiv.id,language:lang,mode:"readonly-errors",value:""}));
    feedback.push(new ChemicalKeyboard({divId:referenceDiv.id,language:lang,mode:"readonly-errors",value:""}));

    button.addEventListener("click",function(){
      var result=keyboard.compare();
      feedback[0].setComparisonFeedback(result,"student",keyboard.getModel());
      feedback[1].setComparisonFeedback(result,"reference",keyboard.correctAnswer);
      studentTitle.textContent=ChemicalGrammar.feedbackText(lang,"studentAnswer");
      referenceTitle.textContent=ChemicalGrammar.feedbackText(lang,"referenceAnswer");
      section.style.display="block";
      ChemicalGrammar.renderComparison(result,lang,summary,details);
    });
  }

  return {keyboard:keyboard,feedback:feedback};
}
</script>

/* ================================================================
   Rubric: editor rows <-> library format
   rule in the editor: { mode: "none" | "once" | "each", value, max, allMissing }
   ================================================================ */
function rubricRulesFrom(rubric){
  const rules={};
  RUBRIC_CATEGORIES.forEach(category=>{
    const r=rubric?rubric[category]:undefined;
    if(typeof r==="number") rules[category]={mode:"once",value:r,max:"",allMissing:""};
    else if(r&&typeof r==="object") rules[category]={
      mode:"each",
      value:Number(r.each)||0,
      max:r.max!==undefined?r.max:"",
      allMissing:r.allMissing!==undefined?r.allMissing:""
    };
    else rules[category]={mode:"none",value:10,max:"",allMissing:""};
  });
  return rules;
}

function rubricForLibrary(){
  if(!state.rubricEnabled) return null;
  const rubric={};
  RUBRIC_CATEGORIES.forEach(category=>{
    const rule=state.rubric[category];
    if(rule.mode==="once") rubric[category]=clampPercent(rule.value);
    else if(rule.mode==="each"){
      const r={each:clampPercent(rule.value)};
      if(rule.max!==""&&rule.max!==null) r.max=clampPercent(rule.max);
      if(PER_ERROR_ONLY_EXTRA[category]&&rule.allMissing!==""&&rule.allMissing!==null) r.allMissing=clampPercent(rule.allMissing);
      rubric[category]=r;
    }
  });
  return rubric;
}

function clampPercent(v){
  const n=Number(v);
  if(!isFinite(n)) return 0;
  return Math.max(0,Math.min(100,n));
}

/* ================================================================

function questionConfig(){
  const cfg={
    tool:FILE_TOOL,
    formatVersion:FILE_VERSION,
    questionId:state.questionId,
    libraryUrl:state.libraryUrl,
    language:state.language,
    elementsMode:state.elementsMode,
    correctAnswer:state.correctAnswer,
    value:state.value,
    checkButton:state.checkButton,
    answerField:state.answerField
  };
  if(state.elementsMode==="custom") cfg.elements=state.elements.slice();
  if(state.distinguishIsomers) cfg.distinguishIsomers=true;
  const rubric=rubricForLibrary();
  if(rubric) cfg.rubric=rubric;
  return cfg;
}

function applyConfig(cfg){
  const s=newState();
  if(typeof cfg.questionId==="string") s.questionId=cfg.questionId;
  if(typeof cfg.libraryUrl==="string"&&cfg.libraryUrl&&!/^file:/i.test(cfg.libraryUrl)) s.libraryUrl=cfg.libraryUrl;
  if(["he","ar","en"].indexOf(cfg.language)>=0) s.language=cfg.language;
  if(["default","custom","none"].indexOf(cfg.elementsMode)>=0) s.elementsMode=cfg.elementsMode;
  if(Array.isArray(cfg.elements)) s.elements=cfg.elements.filter(e=>ALL_ELEMENTS.indexOf(e)>=0);
  s.correctAnswer=typeof cfg.correctAnswer==="string"?cfg.correctAnswer:"";
  s.value=typeof cfg.value==="string"?cfg.value:"";
  s.distinguishIsomers=cfg.distinguishIsomers===true;
  s.checkButton=cfg.checkButton!==false;
  s.answerField=cfg.answerField===true;
  s.rubricEnabled=!!cfg.rubric;
  s.rubric=rubricRulesFrom(cfg.rubric||SAMPLE_RUBRIC);
  state=s;
}

    "document.head.appendChild(script);",
    "})();",
    "<\/script>"
  ].join("\n");
}

/* Reads the configuration back from a saved snippet (or a plain JSON file). */
function parseFile(text){
  let json=null;
  const match=/<script[^>]*type=["']application\/json["'][^>]*>([\s\S]*?)<\/script>/i.exec(text);
  if(match) json=match[1];
  else if(/^\s*\{/.test(text)) json=text;
  if(!json) throw new Error("no configuration");
  const cfg=JSON.parse(json);
  if(!cfg||cfg.tool!==FILE_TOOL) throw new Error("not a builder file");
  return cfg;
}

/* ================================================================
   Keyboards
   ================================================================ */
function removeKeyboard(keyboard){
  if(!keyboard) return;
  [keyboard.root,keyboard.elementPanel,keyboard.atomPanel].forEach(el=>{
    if(el&&el.parentNode) el.parentNode.removeChild(el);
  });
}

function keyboardElements(){
  if(state.elementsMode==="none") return [];
  if(state.elementsMode==="custom") return state.elements.slice();
  return undefined;
}

/* Only one keyboard window open at a time: opening one closes the others. */
function openKeyboards(){
  return [referenceKeyboard,initialKeyboard,tryRun&&tryRun.keyboard].filter(Boolean);
}
function oneWindowAtATime(keyboard){
  const show=keyboard.show;
  keyboard.show=function(){
    openKeyboards().forEach(other=>{ if(other!==keyboard) other.hide(); });
    return show.apply(keyboard,arguments);
  };
}

/*
 * Keyboard model -> the value text that setValue reads (H_{2}O, SO_{4}^{2-}, NaCl(aq), →[Δ]).
 * getValue() cannot be used: it drops the sub/sup levels (2H_{2}O comes back as ₂H₂O).
 * Same as showChars in chemTests.js, whose setValue cases check the round trip.
 */
function modelToValue(chars){
  let out="";
  let i=0;
  while(i<chars.length){
    const c=chars[i];
    if(c.kind==="state"){ out+=c.ch; i+=1; continue; }
    if(c.script==="sub"||c.script==="sup"){
      const script=c.script;
      let run="";
      while(i<chars.length&&chars[i].script===script&&chars[i].kind!=="state"){ run+=chars[i].ch; i+=1; }
      out+=(script==="sub"?"_{":"^{")+run+"}";
      continue;
    }
    out+=c.ch;
    if(c.condition&&c.condition.length) out+="["+modelToValue(c.condition)+"]";
    i+=1;
  }
  return out;
}

function makeEditor(hostId,value,onValue){
  const options={divId:hostId,language:state.language,mode:"edit",value:value,
    onChange:r=>{ if(!building) onValue(modelToValue(r.model)); }};
  const elements=keyboardElements();
  if(elements) options.elements=elements;
  const keyboard=new ChemicalKeyboard(options);
  oneWindowAtATime(keyboard);
  return keyboard;
}

function buildKeyboards(){
  building=true;
  removeKeyboard(referenceKeyboard);
  removeKeyboard(initialKeyboard);
  referenceKeyboard=makeEditor("referenceHost",state.correctAnswer,v=>{
    state.correctAnswer=v; clearReferenceCheck(); changed({try:"sync"});
  });
  initialKeyboard=makeEditor("initialHost",state.value,v=>{
    state.value=v; changed(); buildTry();   // the student starts from the initial answer
  });
  building=false;
  buildTry();
}

function buildTry(){
  if(tryRun){
    removeKeyboard(tryRun.keyboard);
    tryRun.feedback.forEach(removeKeyboard);
  }
  const cfg=questionConfig();
  cfg.checkButton=true;      // the teacher always gets the check button here
  cfg.answerField=false;
  building=true;
  tryRun=chemkbdRun($("tryHost"),cfg);
  building=false;
  oneWindowAtATime(tryRun.keyboard);
}

/* Reference answer / rubric / isomers changed: the "try" keyboard checks against the new values. */
function syncTry(){
  if(!tryRun) return;
  const keyboard=tryRun.keyboard;
  keyboard.setCorrectAnswer(state.correctAnswer);
  keyboard.setRubric(rubricForLibrary());
  keyboard.config.distinguishIsomers=state.distinguishIsomers;
}

/* ================================================================
   Elements panel editor
   ================================================================ */
function elementPosition(z){   // [row, column]; rows 9 and 10 are the f-block
  if(z===1) return [1,1];
  if(z===2) return [1,18];
  if(z<=10) return [2,z<=4?z-2:z+8];
  if(z<=18) return [3,z<=12?z-10:z];
  if(z<=36) return [4,z-18];
  if(z<=54) return [5,z-36];
  if(z<=56) return [6,z-54];
  if(z<=71) return [9,z-54];
  if(z<=86) return [6,z-68];
  if(z<=88) return [7,z-86];
  if(z<=103) return [10,z-86];
  return [7,z-100];
}

function buildPeriodicTable(){
  const grid=$("periodic");
  grid.textContent="";
  ALL_ELEMENTS.forEach((symbol,i)=>{
    const pos=elementPosition(i+1);
    const b=document.createElement("button");
    b.type="button";
    b.textContent=symbol;
    b.title=symbol+" ("+(i+1)+")";
    b.dataset.symbol=symbol;
    b.style.gridRow=String(pos[0]);
    b.style.gridColumn=String(pos[1]);
    b.addEventListener("click",()=>toggleElement(symbol));
    grid.appendChild(b);
  });
  const gap=document.createElement("div");
  gap.className="gap";
  gap.style.gridRow="8";
  grid.appendChild(gap);
}

function toggleElement(symbol){
  const i=state.elements.indexOf(symbol);
  if(i>=0) state.elements.splice(i,1);
  else state.elements.push(symbol);
  elementsChanged();
}

function addElements(list){
  list.forEach(e=>{ if(state.elements.indexOf(e)<0) state.elements.push(e); });
}

function elementsChanged(){
  renderElements();
  buildKeyboards();
  changed();
}

function renderElements(){
  document.querySelectorAll("input[name=elementsMode]").forEach(r=>{ r.checked=r.value===state.elementsMode; });
  $("customElements").classList.toggle("disabled",state.elementsMode!=="custom");

  document.querySelectorAll("#periodic button").forEach(b=>{
    b.classList.toggle("picked",state.elements.indexOf(b.dataset.symbol)>=0);
  });
  renderReferenceElements();

  const chips=$("chips");
  chips.textContent="";
  if(!state.elements.length){
    const empty=document.createElement("span");
    empty.className="empty";
    empty.textContent=t("noElements");
    chips.appendChild(empty);
    return;
  }
  state.elements.forEach((symbol,index)=>{
    const chip=document.createElement("span");
    chip.className="chip";
    chip.textContent=symbol;
    chip.draggable=true;
    chip.addEventListener("click",()=>toggleElement(symbol));
    chip.addEventListener("dragstart",e=>{
      chip.classList.add("dragging");
      e.dataTransfer.setData("text/plain",String(index));
      e.dataTransfer.effectAllowed="move";
    });
    chip.addEventListener("dragend",()=>chip.classList.remove("dragging"));
    chip.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; });
    chip.addEventListener("drop",e=>{
      e.preventDefault();
      const from=Number(e.dataTransfer.getData("text/plain"));
      if(!isFinite(from)||from===index) return;
      const moved=state.elements.splice(from,1)[0];
      state.elements.splice(index,0,moved);
      elementsChanged();
    });
    chips.appendChild(chip);
  });
}

/* Element symbols in an answer (reaction conditions in [...] and states are skipped). */
function elementsIn(value){
  const text=(value||"").replace(/\[[^\]]*\]/g," ").replace(/\((s|l|g|aq)\)/g," ");
  const found=[];
  const re=/[A-Z][a-z]?/g;
  let m;
  while((m=re.exec(text))){
    let symbol=m[0];
    if(ALL_ELEMENTS.indexOf(symbol)<0&&symbol.length===2){
      symbol=symbol[0];
      re.lastIndex-=1;
    }
    if(ALL_ELEMENTS.indexOf(symbol)>=0&&found.indexOf(symbol)<0) found.push(symbol);
  }
  return found;
}

function panelElements(){
  if(state.elementsMode==="default") return DEFAULT_ELEMENTS;
  if(state.elementsMode==="custom") return state.elements;
  return null;      // none: the student always uses the full list, nothing to report
}

/* ================================================================
   Rubric editor
   ================================================================ */
function renderRubric(){
  $("useRubric").checked=state.rubricEnabled;
  $("rubricBody").classList.toggle("disabled",!state.rubricEnabled);

  /*
   * One row per category, one column per value: how it is counted | penalty | maximum | no states at all.
   * A value that does not apply to the chosen way of counting shows "—"; "no states at all" exists only for states.
   */
  const body=$("rubricRows");
  body.textContent="";
  RUBRIC_CATEGORIES.forEach(category=>{
    const rule=state.rubric[category];
    const tr=document.createElement("tr");
    if(rule.mode==="none") tr.className="off";

    const name=document.createElement("td");
    name.className="category";
    name.textContent=t("cat")[category];
    tr.appendChild(name);

    const modeCell=document.createElement("td");
    const mode=document.createElement("select");
    [["none","ruleNone"],["once","ruleOnce"],["each","ruleEach"]].forEach(([value,key])=>{
      const o=document.createElement("option");
      o.value=value;
      o.textContent=t(key);
      mode.appendChild(o);
    });
    mode.value=rule.mode;
    mode.addEventListener("change",()=>{ rule.mode=mode.value; renderRubric(); rubricChanged(); });
    modeCell.appendChild(mode);
    tr.appendChild(modeCell);

    tr.appendChild(valueCell(rule.mode!=="none"?percentInput(rule,"value",false):null));
    tr.appendChild(valueCell(rule.mode==="each"?percentInput(rule,"max",true,t("noLimit")):null));
    tr.appendChild(valueCell(
      rule.mode==="each"&&PER_ERROR_ONLY_EXTRA[category]?percentInput(rule,"allMissing",true,t("noLimit")):null,
      !PER_ERROR_ONLY_EXTRA[category]));

    body.appendChild(tr);
  });
}

/* A table cell with a value, "—" when it does not apply now, or nothing when it never applies to the category. */
function valueCell(content,never){
  const td=document.createElement("td");
  td.className="value";
  if(content) td.appendChild(content);
  else if(!never){
    const na=document.createElement("span");
    na.className="na";
    na.textContent="—";
    td.appendChild(na);
  }
  return td;
}

/* The number and its "%" in a left-to-right box, so the "%" is on the right in every language. */
function percentInput(rule,key,optional,placeholder){
  const box=document.createElement("span");
  box.className="pct";
  box.dir="ltr";
  const input=document.createElement("input");
  input.type="number";
  input.min="0";
  input.max="100";
  input.step="1";
  if(placeholder) input.placeholder=placeholder;
  input.value=rule[key];
  input.addEventListener("input",()=>{
    rule[key]=input.value===""&&optional?"":clampPercent(input.value);
    rubricChanged();
  });
  box.appendChild(input);
  box.appendChild(document.createTextNode("%"));
  return box;
}

function rubricChanged(){ changed({try:"sync"}); }

/* ================================================================
   Checks, output, file state
   ================================================================ */
function renderReferenceStatus(){
  const status=$("referenceStatus");
  status.textContent="";
  status.className="status";

  if(!state.correctAnswer){
    status.textContent=t("referenceEmpty");
    status.classList.add("bad");
    return;
  }

  const problems=referenceProblems();
  if(problems.length){
    status.classList.add("bad");
    const ul=document.createElement("ul");
    problems.forEach(p=>{ const li=document.createElement("li"); li.textContent=p; ul.appendChild(li); });
    status.appendChild(document.createTextNode(t("issueReference")));
    status.appendChild(ul);
    return;
  }

  status.classList.add("ok");
  status.appendChild(document.createTextNode(t("referenceOk")));
}

/*
 * "Check the reference answer": the full check of the reference on its own - syntax, unknown
 * elements and, for an equation, the balance of each atom. The reference is compared with itself,
 * so the only errors left are those of the answer itself; the problem parts are marked on a
 * read-only copy, as in the student's feedback.
 */
const REFERENCE_CHECK_CODES=["syntax-error","unknown-element","unbalanced-atom"];

function checkReference(){
  const box=$("referenceCheck");
  const view=$("referenceCheckView");
  clearReferenceCheck();

  if(!state.correctAnswer){
    box.className="status bad";
    box.textContent=t("referenceEmpty");
    return;
  }

  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,teacherLanguage,
    {distinguishIsomers:state.distinguishIsomers});
  const problems=result.errors.filter(e=>REFERENCE_CHECK_CODES.indexOf(e.code)>=0);
  const texts=[];
  problems.forEach(e=>{ if(texts.indexOf(e.description)<0) texts.push(e.description); });

  if(!texts.length){
    box.className="status ok";
    box.textContent=t(/[→⇌]/.test(state.correctAnswer)?"referenceBalanced":"referenceFormulaOk");
    return;
  }

  box.className="status bad";
  box.appendChild(document.createTextNode(t("referenceProblemsTitle")));
  const ul=document.createElement("ul");
  texts.forEach(text=>{ const li=document.createElement("li"); li.textContent=text; ul.appendChild(li); });
  box.appendChild(ul);

  const marked=new ChemicalKeyboard({divId:"referenceCheckView",language:state.language,mode:"readonly-errors",value:""});
  marked.setComparisonFeedback(Object.assign({},result,{errors:problems}),"student",referenceKeyboard.getModel());
  view.style.display="";
}

/* The check shows one version of the reference; it is cleared when the reference changes. */
function clearReferenceCheck(){
  $("referenceCheck").textContent="";
  $("referenceCheck").className="status";
  $("referenceCheckView").textContent="";
}

/*
 * The elements of the reference answer, each marked "on the panel" or "only in the full list"
 * (as a chip, and on the periodic table). Follows the reference answer as it is typed.
 */
function renderReferenceElements(){
  const used=elementsIn(state.correctAnswer);
  const onPanel=panelElements()||[];
  const box=$("refElements");

  box.textContent="";
  if(!used.length){
    const none=document.createElement("span");
    none.className="empty";
    none.textContent=t("refElementsNone");
    box.appendChild(none);
  }
  used.forEach(symbol=>{
    const chip=document.createElement("span");
    chip.className="chip "+(onPanel.indexOf(symbol)>=0?"on-panel":"full-list");
    chip.textContent=symbol;
    chip.title=t(onPanel.indexOf(symbol)>=0?"legendOnPanel":"legendFullList");
    box.appendChild(chip);
  });

  $("addFromReference").disabled=!used.some(symbol=>onPanel.indexOf(symbol)<0);

  document.querySelectorAll("#periodic button").forEach(b=>{
    b.classList.toggle("in-reference",used.indexOf(b.dataset.symbol)>=0);
  });
}

/* Syntax errors and unknown elements of the reference answer, in the teacher's language. */
function referenceProblems(){
  if(!state.correctAnswer) return [];
  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,teacherLanguage,{});
  const texts=[];
  result.errors.forEach(e=>{
    if((e.code==="syntax-error"||e.code==="unknown-element")&&texts.indexOf(e.description)<0) texts.push(e.description);
  });
  return texts;
}

function renderIssues(){
  const issues=[];
  if(!/^[A-Za-z0-9_-]+$/.test(state.questionId)) issues.push(t("issueId"));
  if(!state.libraryUrl.trim()) issues.push(t("issueUrl"));
  if(!state.correctAnswer) issues.push(t("referenceEmpty"));
  else if(referenceProblems().length) issues.push(t("issueReference"));
  const info=[];
  if(state.rubricEnabled&&RUBRIC_CATEGORIES.every(c=>state.rubric[c].mode==="none")) info.push(t("issueNoPenalty"));

  const box=$("issues");
  box.textContent="";
  box.className="status";
  if(!issues.length&&!info.length){
    box.classList.add("ok");
    box.textContent=t("ready");
    return;
  }
  if(issues.length) box.appendChild(document.createTextNode(t("issuesTitle")));
  const ul=document.createElement("ul");
  issues.forEach(text=>{ const li=document.createElement("li"); li.textContent=text; ul.appendChild(li); });
  info.forEach(text=>{ const li=document.createElement("li"); li.className="info"; li.textContent=text; ul.appendChild(li); });
  box.appendChild(ul);
}

function renderOutput(){
  $("output").value=snippet();
  $("copyStatus").textContent="";
}

function renderFileState(){
  $("fileName").textContent=fileName||t("untitled");
  $("dirtyMark").textContent=dirty?t("unsaved"):"";
}

function changed(options){
  dirty=true;
  if(options&&options.try==="sync") syncTry();
  renderReferenceStatus();
  renderReferenceElements();
  renderIssues();
  renderOutput();
  renderFileState();
}

/* ================================================================
   Whole page
   ================================================================ */
function renderTexts(){
  document.documentElement.lang=teacherLanguage;
  document.documentElement.dir=teacherLanguage==="en"?"ltr":"rtl";
  document.title=t("appTitle");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent=t(el.dataset.t); });
  $("teacherLanguage").value=teacherLanguage;
}

function renderSettings(){
  $("studentLanguage").value=state.language;
  $("questionId").value=state.questionId;
  $("libraryUrl").value=state.libraryUrl;
  $("distinguishIsomers").checked=state.distinguishIsomers;
  $("checkButton").checked=state.checkButton;
  $("answerField").checked=state.answerField;
}

function renderAll(){
  clearReferenceCheck();    // its texts are in the teacher's language; press the button again
  renderTexts();
  renderSettings();
  renderElements();
  renderRubric();
  renderReferenceStatus();
  renderIssues();
  renderOutput();
  renderFileState();
}

function loadState(cfg,name,handle){
  if(cfg) applyConfig(cfg); else state=newState();
  fileName=name||null;
  fileHandle=handle||null;
  dirty=false;
  buildKeyboards();
  renderAll();
}

/* ================================================================
   Files
   ================================================================ */
function confirmDiscard(){
  return !dirty||window.confirm(t("confirmDiscard"));
}

function openText(text,name,handle){
  let cfg;
  try{ cfg=parseFile(text); }
  catch(e){ window.alert(t("openError")); return; }
  loadState(cfg,name,handle);
}

async function openFile(){
  if(!confirmDiscard()) return;
  if(window.showOpenFilePicker){
    try{
      const [handle]=await window.showOpenFilePicker({types:[{description:"Text",accept:{"text/plain":[".txt"]}}]});
      const file=await handle.getFile();
      openText(await file.text(),file.name,handle);
    }catch(e){ if(e.name!=="AbortError") window.alert(t("openError")); }
    return;
  }
  $("fileInput").value="";
  $("fileInput").click();
}

async function saveFile(saveAs){
  const text=snippet();
  const suggested=fileName||(state.questionId||"question")+".txt";

  if(window.showSaveFilePicker){
    try{
      let handle=saveAs?null:fileHandle;
      if(!handle) handle=await window.showSaveFilePicker({suggestedName:suggested,types:[{description:"Text",accept:{"text/plain":[".txt"]}}]});
      const writable=await handle.createWritable();
      await writable.write(text);
      await writable.close();
      fileHandle=handle;
      fileName=handle.name;
      dirty=false;
      renderFileState();
    }catch(e){ if(e.name!=="AbortError") window.alert(e.message); }
    return;
  }

  /* No file system access: download the file. */
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=suggested;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  fileName=suggested;
  dirty=false;
  renderFileState();
}

/* ================================================================
   Events
   ================================================================ */
$("teacherLanguage").addEventListener("change",e=>{
  teacherLanguage=e.target.value;
  savePreference("teacherLanguage",teacherLanguage);
  renderAll();
});

$("studentLanguage").addEventListener("change",e=>{
  state.language=e.target.value;
  buildKeyboards();
  changed();
});
$("questionId").addEventListener("input",e=>{ state.questionId=e.target.value.trim(); changed(); });
$("libraryUrl").addEventListener("input",e=>{ state.libraryUrl=e.target.value.trim(); changed(); });
$("distinguishIsomers").addEventListener("change",e=>{ state.distinguishIsomers=e.target.checked; changed({try:"sync"}); });
$("checkButton").addEventListener("change",e=>{ state.checkButton=e.target.checked; changed(); });
$("answerField").addEventListener("change",e=>{ state.answerField=e.target.checked; changed(); });

document.querySelectorAll("input[name=elementsMode]").forEach(radio=>{
  radio.addEventListener("change",()=>{
    if(!radio.checked) return;
    state.elementsMode=radio.value;
    if(state.elementsMode==="custom"&&!state.elements.length) state.elements=DEFAULT_ELEMENTS.slice();
    elementsChanged();
  });
});
/* From the default set or "none" this switches to a custom panel: the current panel plus the missing elements. */
$("addFromReference").addEventListener("click",()=>{
  if(state.elementsMode!=="custom") state.elements=(panelElements()||[]).slice();
  state.elementsMode="custom";
  addElements(elementsIn(state.correctAnswer));
  elementsChanged();
});
$("startFromDefault").addEventListener("click",()=>{ state.elements=DEFAULT_ELEMENTS.slice(); elementsChanged(); });
$("clearElements").addEventListener("click",()=>{ state.elements=[]; elementsChanged(); });

$("copyFromReference").addEventListener("click",()=>{ initialKeyboard.setValue(state.correctAnswer); });
$("clearInitial").addEventListener("click",()=>{ initialKeyboard.setValue(""); });

$("useRubric").addEventListener("change",e=>{ state.rubricEnabled=e.target.checked; renderRubric(); rubricChanged(); });
$("resetRubric").addEventListener("click",()=>{ state.rubric=rubricRulesFrom(SAMPLE_RUBRIC); renderRubric(); rubricChanged(); });

$("restartTry").addEventListener("click",buildTry);
$("checkReference").addEventListener("click",checkReference);

$("copyOutput").addEventListener("click",()=>{
  const area=$("output");
  area.select();
  const done=()=>{ $("copyStatus").textContent=t("copied"); };
  if(navigator.clipboard) navigator.clipboard.writeText(area.value).then(done,()=>{ document.execCommand("copy"); done(); });
  else { document.execCommand("copy"); done(); }
});

$("newBtn").addEventListener("click",()=>{ if(confirmDiscard()) loadState(null); });
$("openBtn").addEventListener("click",openFile);
$("saveBtn").addEventListener("click",()=>saveFile(false));
$("saveAsBtn").addEventListener("click",()=>saveFile(true));
$("fileInput").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  file.text().then(text=>openText(text,file.name,null));
});

window.addEventListener("beforeunload",e=>{
  if(dirty){ e.preventDefault(); e.returnValue=""; }
});

/* ================================================================
   Start
   ================================================================ */
buildPeriodicTable();
loadState(null);
})();
</script>
</body>
</html>
