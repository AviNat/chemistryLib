<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת מקלדת כימית</title>
<script>
window.MathJax={tex:{inlineMath:[["\\(","\\)"]]},svg:{fontCache:"global"}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body style="font-family:Arial,sans-serif;max-width:1050px;margin:20px auto;padding:0 12px;background:#f6f8fb">
<h1>מקלדת לנוסחאות ולמשוואות כימיות — גרסת בדיקה</h1>
<h2>1. מצב עריכה</h2>
<div id="editor"></div>
<button type="button" id="loadWater">טען 2H₂O</button><br>
<button type="button" id="loadIronEquation">Iron oxide example</button>
<button type="button" id="loadIonEquation">Ionic example</button>
<button type="button" id="loadIsomerEquation">Isomer example (distinguishIsomers)</button>
<button type="button" id="loadHydrateEquation">Hydrate example (dot)</button>
<button type="button" id="loadScaledEquation">Scaled coefficients example</button><br>
<button type="button" id="submitAnswer">Submit and check</button>
<div id="checkSummary"></div>
<div id="checkDetails"></div>

<section id="comparisonFeedback" style="display:none;margin-top:18px">
<h3 id="studentFeedbackTitle"></h3>
<div id="studentFeedback"></div>
<h3 id="referenceFeedbackTitle"></h3>
<div id="referenceFeedback"></div>
</section>

<button type="button" id="copyToReadonly">העבר לתצוגה</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr">
<div><b>LaTeX</b><pre id="latex" style="white-space:pre-wrap;background:#fff;padding:8px"></pre></div>
<div><b>AST</b><pre id="ast" style="white-space:pre-wrap;max-height:360px;overflow:auto;padding:8px"></pre></div>
</div>
<h2>2. מצב קריאה בלבד</h2>
<div id="readonly" style="display:none"></div>
<h2>בדיקת API</h2>
<pre id="api" style="display:none;direction:ltr;text-align:left;background:#fff;padding:10px"></pre>
<script src="chemical-keyboard-v4.js"></script>
<script>
var editor=new ChemicalKeyboard({
  divId:"editor",language:"he",mode:"edit",
  elements:["H","C","N","O","Na","Cl","Ca","Fe","Ag","Cu","S"],
  correctAnswer:"2Fe_{2}O_{3}(s)→4FeO(s)+O_{2}(g)",
  // grading rubric (see RUBRIC-DESIGN.md); remove it to check without grading
  rubric:{
    answerType:100,
    unknownElement:50,
    substances:25,
    coefficients:{each:10,max:20},
    scaledCoefficients:15,
    states:{each:5,max:15,allMissing:20},
    charges:{each:10,max:20},
    arrow:10,
    conditions:5
  },
  onChange:function(result){
    document.getElementById("latex").textContent=result.latex;
    document.getElementById("ast").textContent=JSON.stringify(result.ast,null,2);
  }
  });
var studentFeedback=new ChemicalKeyboard({divId:"studentFeedback",language:"he",mode:"readonly-errors",value:""});
var referenceFeedback=new ChemicalKeyboard({divId:"referenceFeedback",language:"he",mode:"readonly-errors",value:""});
var readonly=new ChemicalKeyboard({divId:"readonly",language:"he",mode:"readonly",value:"2H_{2}+O_{2}→2H_{2}O"});

function clearFeedback(){
  document.getElementById("checkSummary").textContent="";
  document.getElementById("checkDetails").textContent="";
  document.getElementById("comparisonFeedback").style.display="none";
}
// studentValue: optional starting answer (default: the reference itself)
// distinguishIsomers: compare substances by written form (default off)
function loadExample(equation,studentValue,distinguishIsomers){
  editor.config.distinguishIsomers=distinguishIsomers===true;
  editor.setCorrectAnswer(equation);
  editor.setValue(studentValue!==undefined?studentValue:equation);
  clearFeedback();
}
document.getElementById("loadIronEquation").addEventListener("click",function(){loadExample("2Fe_{2}O_{3}(s)→4FeO(s)+O_{2}(g)");});
document.getElementById("loadIonEquation").addEventListener("click",function(){loadExample("Ag^{+}(aq)+Cl^{-}(aq)→AgCl(s)");});
document.getElementById("loadWater").addEventListener("click",function(){loadExample("2H_{2}O");});
// Combustion of ethanol (C2H5OH). The editor starts with its isomer,
// dimethyl ether (CH3OCH3): same atoms, different substance.
// Submit -> "wrong-structure" error. Change it to C2H5OH -> correct.
document.getElementById("loadIsomerEquation").addEventListener("click",function(){
  loadExample(
    "C_{2}H_{5}OH+3O_{2}→2CO_{2}+3H_{2}O",
    "CH_{3}OCH_{3}+3O_{2}→2CO_{2}+3H_{2}O",
    true
  );
});
// Heating copper sulfate pentahydrate (blue) gives anhydrous CuSO4 (white).
// The editor starts with the hydrate written WITHOUT the dot (same atoms):
// Submit -> correct, with the "missing-dot" note.
// Rewrite it as CuSO4·5H2O (· button, then 5) -> correct, no note.
document.getElementById("loadHydrateEquation").addEventListener("click",function(){
  loadExample(
    "CuSO_{4}·5H_{2}O(s)→[Δ]CuSO_{4}(s)+5H_{2}O(g)",
    "CuSO_{4}H_{10}O_{5}(s)→[Δ]CuSO_{4}(s)+5H_{2}O(g)"
  );
});
// Balanced, but every coefficient is twice the reference: one "scaled-coefficients" error.
document.getElementById("loadScaledEquation").addEventListener("click",function(){
  loadExample("2H_{2}(g)+O_{2}(g)→2H_{2}O(l)","4H_{2}(g)+2O_{2}(g)→4H_{2}O(l)");
});
document.getElementById("submitAnswer").addEventListener("click",function(){
  var result=editor.compare(),language=editor.language;
  studentFeedback.setComparisonFeedback(result,"student",editor.getModel());
  referenceFeedback.setComparisonFeedback(result,"reference",editor.correctAnswer);
  document.getElementById("studentFeedbackTitle").textContent=ChemicalGrammar.feedbackText(language,"studentAnswer");
  document.getElementById("referenceFeedbackTitle").textContent=ChemicalGrammar.feedbackText(language,"referenceAnswer");
  document.getElementById("comparisonFeedback").style.display="block";
  ChemicalGrammar.renderComparison(result,language,document.getElementById("checkSummary"),document.getElementById("checkDetails"));
});
document.getElementById("copyToReadonly").addEventListener("click",function(){readonly.setValue(editor.getModel());});
document.getElementById("api").textContent="getValue()\ngetModel()\ngetAST()\nresult()\nsetValue(textOrModel)\nsetMode('edit' | 'readonly' | 'readonly-errors')\nsetComparisonFeedback(result, 'student' | 'reference', textOrModel)";
editor.setValue("2Fe_{2}O_{3}(s)→4FeO(s)+O_{2}(g)");
document.getElementById("ast").style.display="none";
document.getElementById("latex").style.display="none";
</script>
</body>
</html>
