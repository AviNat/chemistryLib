<title>Chemical Question Builder</title>
<!--
  Teacher tool: builds a Moodle question with the chemical keyboard (chemical-keyboard-v4.js).
  The teacher sets the student language, the element keys, the reference answer, an optional
  initial answer and the grading rubric (RUBRIC-DESIGN.md). The output is a snippet to paste into
  the Moodle question text; it is saved as a .txt file and can be opened here again.

  The saved file is the snippet itself. The configuration is in it once, as JSON in a script
  element of type application/json with the id chemkbd-...-config; opening a file reads only that block.

  Nothing in this page may contain the text of a script tag except the real tags (write it as
  "<"+"script" in code): page previewers such as htmlpreview.github.io find the scripts by
  searching for that text, and would cut the code at the wrong place.
  The student-side code is in the library (ChemicalKeyboard.runQuestion, since 2026-10-16); the snippet only
  queues the question and loads the library, with no < > & in its script (Moodle may escape them).
  "Try it as a student" runs the same library code that Moodle will run.
-->

/*

 * page: htmlpreview.github.io loads a written script tag with a src only when the file is on GitHub;
 * any other src (MathJax on jsDelivr) is silently dropped - the display stayed plain LaTeX.
 * A tag added from a script is not touched by it.
 */

<script>
/*
 * The keyboard library: the copy next to this page first (development: changes show at once,
 * before they are pushed), and if there is none, the public GitHub copy (the builder on the internet).
 * The builder starts only after the library has loaded (startBuilder, below).
 */
/*
 * GitHub Pages (2026-10-16): a push is served within ~10 minutes (max-age=600), no purge needed. jsDelivr's @main
 * address was cached up to 12 hours and a purge did not always reach every server (2.6.3 was still served an
 * hour after 2.7.0 was pushed and purged).
 */
var PUBLIC_LIBRARY_URL="https://avinat.github.io/chemistryLib/chemical-keyboard-v4.js";
/* the earlier default address: files saved with it get the new one when opened */
var OLD_PUBLIC_LIBRARY_URL="https://cdn.jsdelivr.net/gh/AviNat/chemistryLib@main/chemical-keyboard-v4.js";
var LIBRARY_SOURCES=[
  {url:"chemical-keyboard-v4.js",kind:"local"},
  {url:PUBLIC_LIBRARY_URL,kind:"public"}
];

function loadKeyboardLibrary(sources,done,failed){
  var script=document.createElement("script");
  script.src=sources[0].url;
  script.onload=function(){
    if(window.ChemicalKeyboard)done(sources[0]);
    else next();
  };
  script.onerror=next;
  document.head.appendChild(script);

  function next(){
    script.remove();
    if(sources.length>1)loadKeyboardLibrary(sources.slice(1),done,failed);
    else failed();
  }
}
</script>

/* ================================================================
   Rubric: editor rows <-> library format
   rule in the editor: { mode: "none" | "once" | "each", value, max, allMissing }
   ================================================================ */
function rubricRulesFrom(rubric){
  const rules={};
  RUBRIC_CATEGORIES.forEach(category=>{
    const r=rubric?rubric[category]:undefined;
    if(typeof r==="number") rules[category]={mode:"once",value:r,max:"",allMissing:""};
    else if(r&&typeof r==="object") rules[category]={
      mode:"each",
      value:Number(r.each)||0,
      max:r.max!==undefined?r.max:"",
      allMissing:r.allMissing!==undefined?r.allMissing:""
    };
    else rules[category]={mode:"none",value:10,max:"",allMissing:""};
  });
  return rules;
}

function rubricForLibrary(){
  if(!state.rubricEnabled) return null;
  const rubric={};
  RUBRIC_CATEGORIES.forEach(category=>{
    const rule=state.rubric[category];
    if(rule.mode==="once") rubric[category]=clampPercent(rule.value);
    else if(rule.mode==="each"){
      const r={each:clampPercent(rule.value)};
      if(rule.max!==""&&rule.max!==null) r.max=clampPercent(rule.max);
      if(PER_ERROR_ONLY_EXTRA[category]&&rule.allMissing!==""&&rule.allMissing!==null) r.allMissing=clampPercent(rule.allMissing);
      rubric[category]=r;
    }
  });
  return rubric;
}

function clampPercent(v){
  const n=Number(v);
  if(!isFinite(n)) return 0;
  return Math.max(0,Math.min(100,n));
}

/* ================================================================
   Configuration: what goes into the file / snippet
   ================================================================ */
function questionConfig(){
  const cfg={
    tool:FILE_TOOL,
    formatVersion:FILE_VERSION,
    questionId:state.questionId,
    libraryUrl:state.libraryUrl,
    language:state.language,
    elementsMode:state.elementsMode,
    correctAnswer:state.correctAnswer,
    value:state.value,
    checkButton:state.checkButton,
    review:{grade:state.reviewGrade,reference:state.reviewReference,details:state.reviewDetails}
  };
  /* always written, also when empty: an emptied field must stay empty when the file is opened again */
  cfg.stack={scoreInput:state.stackScoreInput,answerInput:state.stackAnswerInput};
  if(state.elementsMode==="custom"){
    cfg.elements=state.elements.slice();
    cfg.elementsSort=state.elementsSort;   // builder only: the library ignores it
  }
  if(state.distinguishIsomers) cfg.distinguishIsomers=true;
  if(!state.conditions) cfg.conditions=false;
  if(!state.autoSubscript) cfg.autoSubscript=false;
  if(state.ionKeys) cfg.ionKeys=true;
  if(state.formulaStateKey) cfg.formulaStateKey=true;
  if(state.lipids) cfg.lipids=true;
  if(state.nuclear){
    cfg.nuclear=true;
    if(state.particleLabels==="full") cfg.particleLabels="full";
    if(state.autoNuclideNumbers) cfg.autoNuclideNumbers=true;
    if(state.nuclearStates) cfg.states=true;
  }
  if(state.moleculesOn){
    cfg.molecules=moleculesForLibrary();
    cfg.moleculesMode=state.moleculesMode;   // builder only: the library uses the list
  }
  if(displayChars()) cfg.displayChars=displayChars();
  if(state.reviewDiv) cfg.reviewDiv=state.reviewDiv;
  const rubric=rubricForLibrary();
  if(rubric) cfg.rubric=rubric;
  return cfg;
}

function applyConfig(cfg){
  const s=newState();
  if(typeof cfg.questionId==="string") s.questionId=cfg.questionId;
  if(typeof cfg.libraryUrl==="string"&&cfg.libraryUrl&&!/^file:/i.test(cfg.libraryUrl)) s.libraryUrl=cfg.libraryUrl;
  if(s.libraryUrl===OLD_PUBLIC_LIBRARY_URL) s.libraryUrl=DEFAULT_LIBRARY_URL;   // the old default (jsDelivr) -> GitHub Pages
  if(["system","he","ar","en"].indexOf(cfg.language)>=0) s.language=cfg.language;
  if(["default","custom","none"].indexOf(cfg.elementsMode)>=0) s.elementsMode=cfg.elementsMode;
  if(Array.isArray(cfg.elements)) s.elements=cfg.elements.filter(e=>ALL_ELEMENTS.indexOf(e)>=0);
  /* files from before the option keep their order as it was */
  s.elementsSort=["atomic","alpha","none"].indexOf(cfg.elementsSort)>=0?cfg.elementsSort:Array.isArray(cfg.elements)?"none":"atomic";
  s.correctAnswer=typeof cfg.correctAnswer==="string"?cfg.correctAnswer:"";
  s.value=typeof cfg.value==="string"?cfg.value:"";
  s.distinguishIsomers=cfg.distinguishIsomers===true;
  s.conditions=cfg.conditions!==false;
  s.autoSubscript=cfg.autoSubscript!==false;
  s.ionKeys=cfg.ionKeys===true;
  s.formulaStateKey=cfg.formulaStateKey===true;
  s.nuclear=cfg.nuclear===true;
  s.lipids=cfg.lipids===true;
  s.particleLabels=cfg.particleLabels==="full"?"full":"short";
  s.autoNuclideNumbers=cfg.autoNuclideNumbers===true;
  /* a name: the teacher's string, or {he, ar, en} (the default set) */
  const nameOf=n=>typeof n==="string"?n:n&&typeof n==="object"&&!Array.isArray(n)?n:"";
  const molecules=(Array.isArray(cfg.molecules)?cfg.molecules:[]).map(m=>
    typeof m==="string"?{formula:m,name:""}:m&&typeof m.formula==="string"?{formula:m.formula,name:nameOf(m.name)}:null
  ).filter(m=>m&&m.formula);
  /* files from before the option: a list -> on, custom */
  s.moleculesOn=molecules.length>0||Array.isArray(cfg.molecules)&&typeof cfg.moleculesMode==="string";   // also on with an emptied custom list
  s.moleculesMode=cfg.moleculesMode==="default"?"default":"custom";
  if(!s.moleculesOn) s.moleculesMode="default";
  if(s.moleculesMode==="custom") s.molecules=molecules;
  s.nuclearStates=cfg.nuclear===true&&cfg.states===true;
  s.checkButton=false;             // hidden option: older files that had it on are saved without it
  if(cfg.displayChars>0) s.displayChars=String(cfg.displayChars);
  if(typeof cfg.reviewDiv==="string") s.reviewDiv=cfg.reviewDiv;
  const review=cfg.review||{};     // files from before these options: all shown
  s.reviewGrade=review.grade!==false;
  s.reviewReference=review.reference!==false;
  s.reviewDetails=review.details!==false;
  if(cfg.stack){      // files from before the STACK fields keep the defaults (ans1, ans2)
    s.stackScoreInput=typeof cfg.stack.scoreInput==="string"?cfg.stack.scoreInput:"";
    s.stackAnswerInput=typeof cfg.stack.answerInput==="string"?cfg.stack.answerInput:"";
  }
  s.rubricEnabled=!!cfg.rubric;
  s.rubric=rubricRulesFrom(cfg.rubric||SAMPLE_RUBRIC);
  state=s;
}

const SCRIPT_OPEN="<"+"script";
const SCRIPT_CLOSE="<"+"/script>";

function snippet(){
  const id=configId();
  /* the JSON never contains < > & (a Moodle server or filter may turn them into &lt; &gt; &amp;) */
  /* one line, no indentation: Moodle (auto-format) turns every line break into <br /> - also inside scripts */
  const json=JSON.stringify(questionConfig())
    .replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/&/g,"\\u0026");
  /*
   * The student-side code is in the library (ChemicalKeyboard.runQuestion). The script below only queues the
   * question and loads the library once per page, and is written WITHOUT the characters < > & - Moodle may
   * escape them inside a pasted script (found 2026-10-16), which broke the code when it was all in the snippet.
   */
  const loader=[
    "(function(){",
    "var id="+JSON.stringify(id)+",url="+JSON.stringify(state.libraryUrl)+";",
    "var queue=window.__chemkbdQuestions=window.__chemkbdQuestions||[];",
    "queue.push({id:id,script:document.currentScript});",
    "if(window.ChemicalKeyboard){if(window.ChemicalKeyboard.startQueuedQuestions){window.ChemicalKeyboard.startQueuedQuestions();}return;}",
    "if(window.__chemkbdLoading){return;}",
    "window.__chemkbdLoading=true;",
    "var s=document.createElement(\"script\");",
    "s.src=url;",
    "s.onerror=function(){if(window.console){console.error(\"[chemkbd \"+id+\"] the library could not be loaded: \"+url);}};",
    "document.head.appendChild(s);",
    "})();"
  ].join("");
  if(/[<>&\n]/.test(loader)) throw new Error("the snippet's script must not contain < > & or line breaks");
  /*
   * The whole snippet is ONE line (2026-10-16): Moodle's auto-format turns each line break of the question text
   * into <br />, also inside a script, where it breaks the code ("Unexpected token '<'").
   */
  return [
    "<!-- Chemical keyboard question \""+state.questionId+"\" (code version "+SNIPPET_VERSION+"). Created with the chemical keyboard question builder: to change it, open the saved file in the builder. Do not edit by hand. -->",
    "<div id=\""+id+"\"></div>",
    SCRIPT_OPEN+" type=\"application/json\" id=\""+id+"-config\">"+json+SCRIPT_CLOSE,
    SCRIPT_OPEN+">"+loader+SCRIPT_CLOSE
  ].join("");
}

/* Reads the configuration back from a saved snippet (or a plain JSON file). */
function parseFile(text){
  let json=null;
  const match=new RegExp(SCRIPT_OPEN+"[^>]*type=[\"']application/json[\"'][^>]*>([\\s\\S]*?)"+SCRIPT_CLOSE,"i").exec(text);
  if(match) json=match[1];
  else if(/^\s*\{/.test(text)) json=text;
  if(!json) throw new Error("no configuration");
  const cfg=JSON.parse(json);
  if(!cfg||cfg.tool!==FILE_TOOL) throw new Error("not a builder file");
  return cfg;
}

/* ================================================================
   Keyboards
   ================================================================ */
function removeKeyboard(keyboard){
  if(!keyboard) return;
  [keyboard.root,keyboard.elementPanel,keyboard.atomPanel].forEach(el=>{
    if(el&&el.parentNode) el.parentNode.removeChild(el);
  });
}

function keyboardElements(){
  if(state.elementsMode==="none") return [];
  if(state.elementsMode==="custom") return state.elements.slice();
  return undefined;
}

/* Only one keyboard window open at a time: opening one closes the others. */
function openKeyboards(){
  return [referenceKeyboard,initialKeyboard,moleculeKeyboard,tryRun&&tryRun.keyboard].filter(Boolean);
}
function oneWindowAtATime(keyboard){
  const show=keyboard.show;
  keyboard.show=function(){
    openKeyboards().forEach(other=>{ if(other!==keyboard) other.hide(); });
    return show.apply(keyboard,arguments);
  };
}

/* r.valueText: the answer in the value notation (H_{2}O, SO_{4}^{2-}) - getValue() drops the sub/sup levels */
function makeEditor(hostId,value,onValue){
  const options={divId:hostId,language:previewLanguage(),mode:"edit",value:value,
    onChange:r=>{ if(!building) onValue(r.valueText); }};
  const elements=keyboardElements();
  if(elements) options.elements=elements;
  if(!state.conditions) options.conditions=false;
  if(!state.autoSubscript) options.autoSubscript=false;
  if(state.ionKeys) options.ionKeys=true;
  if(state.formulaStateKey) options.formulaStateKey=true;
  if(state.moleculesOn) options.molecules=moleculesForLibrary();
  if(state.lipids) options.lipids=true;
  if(state.nuclear){
    options.nuclear=true;
    options.particleLabels=state.particleLabels;
    if(state.autoNuclideNumbers) options.autoNuclideNumbers=true;
    if(state.nuclearStates) options.states=true;
  }
  if(displayChars()) options.displayChars=displayChars();
  const keyboard=new ChemicalKeyboard(options);
  oneWindowAtATime(keyboard);
  return keyboard;
}

function buildKeyboards(){
  building=true;
  removeKeyboard(referenceKeyboard);
  removeKeyboard(initialKeyboard);
  referenceKeyboard=makeEditor("referenceHost",state.correctAnswer,v=>{
    state.correctAnswer=v; clearReferenceCheck(); renderMolecules(); changed({try:"sync"});
  });
  initialKeyboard=makeEditor("initialHost",state.value,v=>{
    state.value=v; changed(); buildTry();   // the student starts from the initial answer
  });
  removeKeyboard(moleculeKeyboard);
  moleculeKeyboard=makeEditor("moleculeHost",moleculeDraft,v=>{
    moleculeDraft=v;
    $("moleculeStatus").classList.remove("bad");
    renderAddReminder();
  });
  renderAddReminder();
  building=false;
  buildTry();
}

/*
 * "Submit": the review page the student gets after submitting, made by the library's own review code
 * (ChemicalKeyboard.runQuestion sees read-only STACK inputs, as Moodle renders them) with the review options of
 * this question - grade, detailed feedback, reference answer.
 */
let tryReviewRun=null;
function clearTryReview(){
  if(tryReviewRun){
    removeKeyboard(tryReviewRun.keyboard);
    tryReviewRun.feedback.forEach(removeKeyboard);
    tryReviewRun=null;
  }
  $("tryReview").textContent="";
  $("tryReviewQue").hidden=true;
}
function submitTry(){
  if(!tryRun) return;
  clearTryReview();
  const answer=tryRun.keyboard.getValueText();
  const cfg=questionConfig();
  cfg.language=previewLanguage();
  cfg.stack={scoreInput:"ans1",answerInput:"ans2"};
  delete cfg.reviewDiv;      // the teacher's review div is in the Moodle question text, not on this page
  document.querySelector("[name='try_ans2']").value=answer;
  document.querySelector("[name='try_ans1']").value="";
  $("tryReviewQue").hidden=false;
  tryReviewRun=ChemicalKeyboard.runQuestion($("tryReview"),cfg);
  $("tryReviewQue").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function buildTry(){
  if(tryRun){
    removeKeyboard(tryRun.keyboard);
    tryRun.feedback.forEach(removeKeyboard);
  }
  clearTryReview();
  const cfg=questionConfig();
  delete cfg.stack;          // no STACK inputs on this page
  cfg.language=previewLanguage();
  building=true;
  tryRun=ChemicalKeyboard.runQuestion($("tryHost"),cfg);   // the same library code Moodle runs
  building=false;
  oneWindowAtATime(tryRun.keyboard);
}

/* Reference answer / rubric / isomers changed: the "try" keyboard checks against the new values. */
function syncTry(){
  if(!tryRun) return;
  clearTryReview();          // the shown review was graded against the old values
  const keyboard=tryRun.keyboard;
  keyboard.setCorrectAnswer(state.correctAnswer);
  keyboard.setRubric(rubricForLibrary());
  keyboard.config.distinguishIsomers=state.distinguishIsomers;
}

/* ================================================================
   Elements panel editor
   ================================================================ */
function elementPosition(z){   // [row, column]; rows 9 and 10 are the f-block
  if(z===1) return [1,1];
  if(z===2) return [1,18];
  if(z<=10) return [2,z<=4?z-2:z+8];
  if(z<=18) return [3,z<=12?z-10:z];
  if(z<=36) return [4,z-18];
  if(z<=54) return [5,z-36];
  if(z<=56) return [6,z-54];
  if(z<=71) return [9,z-54];
  if(z<=86) return [6,z-68];
  if(z<=88) return [7,z-86];
  if(z<=103) return [10,z-86];
  return [7,z-100];
}

function buildPeriodicTable(){
  const grid=$("periodic");
  grid.textContent="";
  ALL_ELEMENTS.forEach((symbol,i)=>{
    const pos=elementPosition(i+1);
    const b=document.createElement("button");
    b.type="button";
    b.textContent=symbol;
    b.title=symbol+" ("+(i+1)+")";
    b.dataset.symbol=symbol;
    b.style.gridRow=String(pos[0]);
    b.style.gridColumn=String(pos[1]);
    b.addEventListener("click",()=>toggleElement(symbol));
    grid.appendChild(b);
  });
  const gap=document.createElement("div");
  gap.className="gap";
  gap.style.gridRow="8";
  grid.appendChild(gap);
}

function toggleElement(symbol){
  const i=state.elements.indexOf(symbol);
  if(i>=0) state.elements.splice(i,1);
  else state.elements.push(symbol);
  elementsChanged();
}

function addElements(list){
  list.forEach(e=>{ if(state.elements.indexOf(e)<0) state.elements.push(e); });
}

/* The chosen order (sort buttons) is kept: added elements go to their place in it. */
function sortedElements(list){
  if(state.elementsSort==="alpha") return list.slice().sort();
  if(state.elementsSort==="atomic") return list.slice().sort((a,b)=>ALL_ELEMENTS.indexOf(a)-ALL_ELEMENTS.indexOf(b));
  return list.slice();
}

/* A drag that breaks the order turns the sorting off; one that keeps it (back to its place) does not. */
function elementsMoved(){
  if(sortedElements(state.elements).join()!==state.elements.join()) state.elementsSort="none";
  elementsChanged();
}

function elementsChanged(){
  state.elements=sortedElements(state.elements);
  renderElements();
  buildKeyboards();
  changed();
}

function renderElements(){
  document.querySelectorAll("input[name=elementsMode]").forEach(r=>{ r.checked=r.value===state.elementsMode; });
  $("customElements").classList.toggle("disabled",state.elementsMode!=="custom");
  $("sortAtomic").classList.toggle("on",state.elementsSort==="atomic");
  $("sortAlpha").classList.toggle("on",state.elementsSort==="alpha");
  $("sortAtomic").setAttribute("aria-pressed",String(state.elementsSort==="atomic"));
  $("sortAlpha").setAttribute("aria-pressed",String(state.elementsSort==="alpha"));

  document.querySelectorAll("#periodic button").forEach(b=>{
    b.classList.toggle("picked",state.elements.indexOf(b.dataset.symbol)>=0);
  });
  renderReferenceElements();

  const chips=$("chips");
  chips.textContent="";
  if(!state.elements.length){
    const empty=document.createElement("span");
    empty.className="empty";
    empty.textContent=t("noElements");
    chips.appendChild(empty);
    return;
  }
  state.elements.forEach((symbol,index)=>{
    const chip=document.createElement("span");
    chip.className="chip";
    chip.textContent=symbol;
    chipPointer(chip,index,{container:"chips",list:state.elements,click:()=>toggleElement(symbol),moved:elementsMoved});
    chips.appendChild(chip);
  });
}

/*
 * A chip: a click removes the element; a drag moves it. Pointer events, not the browser's drag
 * and drop: they work the same with a mouse and a finger (tablets), and the drop may be anywhere
 * in the list - the marker shows where the element goes. Removing is on "click" (also sent by
 * assistive tools); the click the browser may send at the end of a drag is ignored.
 */
/* opts: { container: id of the chips' parent, list: the array the chips show, click(), moved() } */
function chipPointer(chip,index,opts){
  let justDragged=false;
  chip.addEventListener("click",()=>{
    if(justDragged){ justDragged=false; return; }
    opts.click();
  });
  chip.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    const startX=e.clientX,startY=e.clientY;
    let dragging=false,target=null;
    chip.setPointerCapture(e.pointerId);

    const move=ev=>{
      if(!dragging&&Math.hypot(ev.clientX-startX,ev.clientY-startY)>5){
        dragging=true;
        chip.classList.add("dragging");
      }
      if(!dragging) return;
      chip.style.transform="translate("+(ev.clientX-startX)+"px,"+(ev.clientY-startY)+"px)";
      target=chipDropIndex(opts.container,chip,ev.clientX,ev.clientY);
      chipDropMarker(opts.container,chip,target);
    };
    const end=ev=>{
      chip.removeEventListener("pointermove",move);
      chip.removeEventListener("pointerup",end);
      chip.removeEventListener("pointercancel",end);
      if(!dragging) return;                                  // a click: handled by the click listener
      justDragged=true;
      setTimeout(()=>{ justDragged=false; },0);              // only the click that follows at once
      chip.classList.remove("dragging");
      chip.style.transform="";
      chipDropMarker(opts.container,chip,null);
      if(target===null||ev.type!=="pointerup") return;
      const item=opts.list.splice(index,1)[0];
      opts.list.splice(target,0,item);
      opts.moved();
    };
    chip.addEventListener("pointermove",move);
    chip.addEventListener("pointerup",end);
    chip.addEventListener("pointercancel",end);
  });
}

/* Where the dragged chip goes: its index in the list without it, from the pointer position (reading order, left to right). */
function chipDropIndex(container,dragged,x,y){
  const others=[...$(container).querySelectorAll(".chip")].filter(c=>c!==dragged);
  for(let i=0;i<others.length;i++){
    const r=others[i].getBoundingClientRect();
    if(y<r.top) return i;                                   // a row above this chip
    if(y<=r.bottom&&x<r.left+r.width/2) return i;           // this row, left of the chip's middle
  }
  return others.length;                                     // after the last chip
}

/* The marker: a bar before the chip the dragged one will be put before (or after the last chip). */
function chipDropMarker(container,dragged,target){
  const others=[...$(container).querySelectorAll(".chip")].filter(c=>c!==dragged);
  others.forEach((c,i)=>{
    c.classList.toggle("drop-before",target===i);
    c.classList.toggle("drop-after",target===others.length&&i===others.length-1);
  });
}

/* ================================================================
   Molecule keys (MOLECULES-DESIGN.md): the teacher types a formula with the keyboard and adds it
   ================================================================ */
let moleculeKeyboard=null;
let moleculeDraft="";

/*
 * Like the element keys: off, the default set (from the library, named in the three student languages) or the
 * teacher's own list (state.molecules). A name is a string (the teacher's, in the student language) or {he, ar, en}.
 */
let removedName=null;      // the name of the key last removed to the editor: kept in all its languages if not changed

function shownMolecules(){
  return state.moleculesMode==="default"?ChemicalGrammar.defaultMolecules():state.molecules;
}

/* the keys of the question: none when off */
function activeMolecules(){
  return state.moleculesOn?shownMolecules():[];
}

/* the name as the builder shows it: in the preview language, else English */
function nameText(name){
  if(!name) return "";
  if(typeof name==="string") return name;
  return name[previewLanguage()]||name.en||"";
}

/* library format: "H_{2}O", or {formula, name} when a name is given */
function moleculesForLibrary(){
  return activeMolecules().map(m=>m.name?{formula:m.formula,name:m.name}:m.formula);
}

function moleculesChanged(){
  renderMolecules();
  buildKeyboards();          // the keys appear in the keyboards of this page too
  changed();
}

/* "Add the key" light blue while a typed formula waits to be added - a reminder before saving the file */
function renderAddReminder(){
  $("addMolecule").classList.toggle("on",moleculeDraft.trim()!=="");
}

/* A removed key goes back to the keyboard (and its name to the name field), to change and add again;
   removing another one replaces it. */
function removeMolecule(index){
  const m=state.molecules.splice(index,1)[0];
  moleculeDraft=m.formula;
  removedName=m.name||null;
  $("moleculeName").value=nameText(m.name);
  $("moleculeStatus").classList.remove("bad");
  moleculesChanged();
}

function addMolecule(){
  const formula=moleculeDraft.trim();
  const status=$("moleculeStatus");
  status.className="status";
  if(!formula){ status.textContent=t("moleculeEmpty"); status.classList.add("bad"); return; }
  const problems=ChemicalGrammar.validate(formula,teacherLanguage);
  if(problems.length){ status.textContent=t("moleculeInvalid")+" "+problems.join(" "); status.classList.add("bad"); return; }
  if(state.molecules.some(m=>m.formula===formula)){ status.textContent=t("moleculeDuplicate"); status.classList.add("bad"); return; }
  const name=$("moleculeName").value.trim();
  /* a key put back with its name unchanged keeps the name in all languages */
  state.molecules.push({formula:formula,name:removedName&&name===nameText(removedName)?removedName:name});
  removedName=null;
  moleculeDraft="";
  $("moleculeName").value="";
  status.textContent="";
  moleculesChanged();
}

function renderMolecules(){
  $("useMolecules").checked=state.moleculesOn;
  $("moleculesBody").classList.toggle("disabled",!state.moleculesOn);
  document.querySelectorAll("input[name=moleculesMode]").forEach(r=>{ r.checked=r.value===state.moleculesMode; });
  $("customMolecules").classList.toggle("disabled",state.moleculesMode!=="custom");
  const shown=shownMolecules();
  const chips=$("moleculeChips");
  chips.textContent="";
  if(!shown.length){
    const empty=document.createElement("span");
    empty.className="empty";
    empty.textContent=t("moleculesNone");
    chips.appendChild(empty);
  }
  shown.forEach((m,index)=>{
    const chip=document.createElement("span");
    chip.className="chip";
    chip.dir="ltr";
    chip.textContent=ChemicalGrammar.plainFormula(m.formula);
    if(m.name) chip.title=chip.textContent+" — "+nameText(m.name);    // the key's tooltip on the keyboard; not its label
    chipPointer(chip,index,{container:"moleculeChips",list:state.molecules,
      click:()=>removeMolecule(index),moved:moleculesChanged});
    chips.appendChild(chip);
  });
  /* keys that appear in the reference answer may give it away (no automatic "add" - design, section 6) */
  const inReference=activeMolecules().filter(m=>state.correctAnswer.indexOf(m.formula)>=0);
  const status=$("moleculeStatus");
  if(!status.classList.contains("bad")){
    status.textContent=inReference.length?t("moleculeGivesAway")+" "+inReference.map(m=>ChemicalGrammar.plainFormula(m.formula)).join(", "):"";
    status.className=inReference.length?"status info":"status";
  }
}

/* Element symbols in an answer (reaction conditions in [...] and states are skipped). */
function elementsIn(value){
  const text=(value||"").replace(/\[[^\]]*\]/g," ").replace(/\((s|l|g|aq)\)/g," ");
  const found=[];
  const re=/[A-Z][a-z]?/g;
  let m;
  while((m=re.exec(text))){
    let symbol=m[0];
    if(ALL_ELEMENTS.indexOf(symbol)<0&&symbol.length===2){
      symbol=symbol[0];
      re.lastIndex-=1;
    }
    if(ALL_ELEMENTS.indexOf(symbol)>=0&&found.indexOf(symbol)<0) found.push(symbol);
  }
  return found;
}

function panelElements(){
  if(state.elementsMode==="default") return DEFAULT_ELEMENTS;
  if(state.elementsMode==="custom") return state.elements;
  return null;      // none: the student always uses the full list, nothing to report
}

/* ================================================================
   Rubric editor
   ================================================================ */
function renderRubric(){
  $("useRubric").checked=state.rubricEnabled;
  $("rubricBody").classList.toggle("disabled",!state.rubricEnabled);

  /*
   * One row per category, one column per value: how it is counted | penalty | maximum | no states at all.
   * A value that does not apply to the chosen way of counting shows "—"; "no states at all" exists only for states.
   */
  const body=$("rubricRows");
  body.textContent="";
  RUBRIC_CATEGORIES.forEach(category=>{
    if(NUCLEAR_ONLY[category]&&!state.nuclear) return;
    if(LIPID_ONLY[category]&&!state.lipids) return;
    const rule=state.rubric[category];
    const tr=document.createElement("tr");
    if(rule.mode==="none") tr.className="off";

    const name=document.createElement("td");
    name.className="category";
    name.textContent=t("cat")[category];
    tr.appendChild(name);

    const modeCell=document.createElement("td");
    const mode=document.createElement("select");
    [["none","ruleNone"],["once","ruleOnce"],["each","ruleEach"]].forEach(([value,key])=>{
      const o=document.createElement("option");
      o.value=value;
      o.textContent=t(key);
      mode.appendChild(o);
    });
    mode.value=rule.mode;
    mode.addEventListener("change",()=>{ rule.mode=mode.value; renderRubric(); rubricChanged(); });
    modeCell.appendChild(mode);
    tr.appendChild(modeCell);

    tr.appendChild(valueCell(rule.mode!=="none"?percentInput(rule,"value",false):null));
    tr.appendChild(valueCell(rule.mode==="each"?percentInput(rule,"max",true,t("noLimit")):null));
    tr.appendChild(valueCell(
      rule.mode==="each"&&PER_ERROR_ONLY_EXTRA[category]?percentInput(rule,"allMissing",true,t("noLimit")):null,
      !PER_ERROR_ONLY_EXTRA[category]));

    body.appendChild(tr);
  });
}

/* A table cell with a value, "—" when it does not apply now, or nothing when it never applies to the category. */
function valueCell(content,never){
  const td=document.createElement("td");
  td.className="value";
  if(content) td.appendChild(content);
  else if(!never){
    const na=document.createElement("span");
    na.className="na";
    na.textContent="—";
    td.appendChild(na);
  }
  return td;
}

/* The number and its "%" in a left-to-right box, so the "%" is on the right in every language. */
function percentInput(rule,key,optional,placeholder){
  const box=document.createElement("span");
  box.className="pct";
  box.dir="ltr";
  const input=document.createElement("input");
  input.type="number";
  input.min="0";
  input.max="100";
  input.step="1";
  if(placeholder) input.placeholder=placeholder;
  input.value=rule[key];
  input.addEventListener("input",()=>{
    rule[key]=input.value===""&&optional?"":clampPercent(input.value);
    rubricChanged();
  });
  box.appendChild(input);
  box.appendChild(document.createTextNode("%"));
  return box;
}

function rubricChanged(){ changed({try:"sync"}); }

/* ================================================================
   Checks, output, file state
   ================================================================ */
function renderReferenceStatus(){
  const status=$("referenceStatus");
  status.textContent="";
  status.className="status";

  if(!state.correctAnswer){
    status.textContent=t("referenceEmpty");
    status.classList.add("bad");
    return;
  }

  const problems=referenceProblems();
  if(problems.length){
    status.classList.add("bad");
    const ul=document.createElement("ul");
    problems.forEach(p=>{ const li=document.createElement("li"); li.textContent=p; ul.appendChild(li); });
    status.appendChild(document.createTextNode(t("issueReference")));
    status.appendChild(ul);
    return;
  }

  status.classList.add("ok");
  status.appendChild(document.createTextNode(t("referenceOk")));
}

/*
 * "Check the reference answer": the full check of the reference on its own - syntax, unknown
 * elements and, for an equation, the balance of each atom. The reference is compared with itself,
 * so the only errors left are those of the answer itself; the problem parts are marked on a
 * read-only copy, as in the student's feedback.
 */
const REFERENCE_CHECK_CODES=["syntax-error","unknown-element","unbalanced-atom"];

function checkReference(){
  const box=$("referenceCheck");
  const view=$("referenceCheckView");
  clearReferenceCheck();

  if(!state.correctAnswer){
    box.className="status bad";
    box.textContent=t("referenceEmpty");
    return;
  }

  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,teacherLanguage,
    {distinguishIsomers:state.distinguishIsomers,lipids:state.lipids});
  const problems=result.errors.filter(e=>REFERENCE_CHECK_CODES.indexOf(e.code)>=0);
  const texts=[];
  problems.forEach(e=>{ if(texts.indexOf(e.description)<0) texts.push(e.description); });

  if(!texts.length){
    box.className="status ok";
    box.textContent=t(/[→⇌]/.test(state.correctAnswer)?"referenceBalanced":"referenceFormulaOk");
    return;
  }

  box.className="status bad";
  box.appendChild(document.createTextNode(t("referenceProblemsTitle")));
  const ul=document.createElement("ul");
  texts.forEach(text=>{ const li=document.createElement("li"); li.textContent=text; ul.appendChild(li); });
  box.appendChild(ul);

  const marked=new ChemicalKeyboard({divId:"referenceCheckView",language:previewLanguage(),mode:"readonly-errors",value:""});
  marked.setComparisonFeedback(Object.assign({},result,{errors:problems}),"student",referenceKeyboard.getModel());
  view.style.display="";
}

/* The check shows one version of the reference; it is cleared when the reference changes. */
function clearReferenceCheck(){
  $("referenceCheck").textContent="";
  $("referenceCheck").className="status";
  $("referenceCheckView").textContent="";
}

/*
 * The elements of the reference answer, each marked "on the panel" or "only in the full list"
 * (as a chip, and on the periodic table). Follows the reference answer as it is typed.
 */
function renderReferenceElements(){
  const used=elementsIn(state.correctAnswer);
  const onPanel=panelElements()||[];
  const box=$("refElements");

  box.textContent="";
  if(!used.length){
    const none=document.createElement("span");
    none.className="empty";
    none.textContent=t("refElementsNone");
    box.appendChild(none);
  }
  used.forEach(symbol=>{
    const chip=document.createElement("span");
    chip.className="chip "+(onPanel.indexOf(symbol)>=0?"on-panel":"full-list");
    chip.textContent=symbol;
    chip.title=t(onPanel.indexOf(symbol)>=0?"legendOnPanel":"legendFullList");
    box.appendChild(chip);
  });

  $("addFromReference").disabled=!used.some(symbol=>onPanel.indexOf(symbol)<0);

  document.querySelectorAll("#periodic button").forEach(b=>{
    b.classList.toggle("in-reference",used.indexOf(b.dataset.symbol)>=0);
  });
}

/* Syntax errors and unknown elements of the reference answer, in the teacher's language. */
function referenceProblems(){
  if(!state.correctAnswer) return [];
  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,teacherLanguage,{lipids:state.lipids});
  const texts=[];
  result.errors.forEach(e=>{
    if((e.code==="syntax-error"||e.code==="unknown-element")&&texts.indexOf(e.description)<0) texts.push(e.description);
  });
  return texts;
}

function renderIssues(){
  const issues=[];
  if(!/^[A-Za-z0-9_-]+$/.test(state.questionId)) issues.push(t("issueId"));
  if(state.reviewDiv&&!/^[A-Za-z0-9_-]+$/.test(state.reviewDiv)) issues.push(t("issueReviewDiv"));
  const stackNames=[state.stackScoreInput,state.stackAnswerInput].filter(Boolean);
  if(stackNames.some(name=>!/^[A-Za-z][A-Za-z0-9_]*$/.test(name))) issues.push(t("issueStackName"));
  if(stackNames.length===2&&stackNames[0]===stackNames[1]) issues.push(t("issueStackSame"));
  if(!state.libraryUrl.trim()) issues.push(t("issueUrl"));
  if(!state.correctAnswer) issues.push(t("referenceEmpty"));
  if(!state.conditions&&/[→⇌]\[/.test(state.correctAnswer)) issues.push(t("issueConditions"));
  else if(referenceProblems().length) issues.push(t("issueReference"));
  const info=[];
  if(state.rubricEnabled&&RUBRIC_CATEGORIES.every(c=>state.rubric[c].mode==="none")) info.push(t("issueNoPenalty"));

  const box=$("issues");
  box.textContent="";
  box.className="status";
  if(!issues.length&&!info.length){
    box.classList.add("ok");
    box.textContent=t("ready");
    return;
  }
  if(issues.length) box.appendChild(document.createTextNode(t("issuesTitle")));
  const ul=document.createElement("ul");
  issues.forEach(text=>{ const li=document.createElement("li"); li.textContent=text; ul.appendChild(li); });
  info.forEach(text=>{ const li=document.createElement("li"); li.className="info"; li.textContent=text; ul.appendChild(li); });
  box.appendChild(ul);
}

function renderOutput(){
  $("output").value=snippet();
  $("copyStatus").textContent="";
  renderStackModels();
}

/*
 * Model answers for the STACK inputs, to copy into the STACK question:
 *   score input:  1
 *   answer input: what it holds for a correct answer - the reference, " || ", and its feedback
 *                 (same format and language as the library's runQuestion writes: savedAnswer / feedbackLine there),
 *                 as a quoted string, because it is a String input.
 */
function stackModelAnswer(){
  /* with "system" the feedback text is in the preview language: STACK never compares with it, it only needs a model answer */
  const result=ChemicalGrammar.compare(state.correctAnswer,state.correctAnswer,previewLanguage(),
    {rubric:rubricForLibrary(),distinguishIsomers:state.distinguishIsomers,lipids:state.lipids});
  const parts=[];
  if(result.score) parts.push(result.score.total+"%");
  else if(result.correct) parts.push(ChemicalGrammar.feedbackText(previewLanguage(),"correct"));
  result.errors.concat(result.notes||[]).forEach(e=>{ if(!e.suppressedBy&&e.description) parts.push(e.description); });
  const feedback=parts.join(" | ").replace(/["\\\u2066-\u2069]/g,"");
  return "\""+state.correctAnswer.replace(/["\\]/g,"")+" || "+feedback+"\"";
}

function renderStackModels(){
  const box=$("stackModels");
  box.textContent="";
  const rows=[];
  if(state.stackScoreInput) rows.push([state.stackScoreInput,"1"]);
  if(state.stackAnswerInput&&state.correctAnswer) rows.push([state.stackAnswerInput,stackModelAnswer()]);

  rows.forEach(([name,value])=>{
    const row=document.createElement("div");
    row.className="model-row";
    const label=document.createElement("span");
    label.className="label";
    label.textContent=t("modelFor").replace("{name}",name);
    const field=document.createElement("input");
    field.type="text";
    field.readOnly=true;
    field.value=value;
    field.addEventListener("focus",()=>field.select());
    const copy=document.createElement("button");
    copy.type="button";
    copy.textContent=t("copy");
    copy.addEventListener("click",()=>{
      field.select();
      const done=()=>{ copy.textContent=t("copied"); setTimeout(()=>{ copy.textContent=t("copy"); },1500); };
      if(navigator.clipboard) navigator.clipboard.writeText(value).then(done,()=>{ document.execCommand("copy"); done(); });
      else { document.execCommand("copy"); done(); }
    });
    row.appendChild(label);
    row.appendChild(field);
    row.appendChild(copy);
    box.appendChild(row);
  });
}

/* ================================================================

   ================================================================ */
function confirmDiscard(){
  return !dirty||window.confirm(t("confirmDiscard"));
}

function openText(text,name,handle){
  let cfg;
  try{ cfg=parseFile(text); }
  catch(e){ window.alert(t("openError")); return; }
  loadState(cfg,name,handle);
}

async function openFile(){
  if(!confirmDiscard()) return;
  if(window.showOpenFilePicker){
    try{
      const [handle]=await window.showOpenFilePicker({types:[{description:"Text",accept:{"text/plain":[".txt"]}}]});
      const file=await handle.getFile();
      openText(await file.text(),file.name,handle);
    }catch(e){ if(e.name!=="AbortError") window.alert(t("openError")); }
    return;
  }
  $("fileInput").value="";
  $("fileInput").click();
}

async function saveFile(saveAs){
  const text=snippet();
  const suggested=fileName||(state.questionId||"question")+".txt";

  if(window.showSaveFilePicker){
    try{
      let handle=saveAs?null:fileHandle;
      if(!handle) handle=await window.showSaveFilePicker({suggestedName:suggested,types:[{description:"Text",accept:{"text/plain":[".txt"]}}]});
      const writable=await handle.createWritable();
      await writable.write(text);
      await writable.close();
      fileHandle=handle;
      fileName=handle.name;
      dirty=false;
      renderFileState();
    }catch(e){ if(e.name!=="AbortError") window.alert(e.message); }
    return;
  }

  /* No file system access: download the file. */
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=suggested;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  fileName=suggested;
  dirty=false;
  renderFileState();
}
