<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת מקלדת כימית</title>

<script>
window.MathJax={
  tex:{
    inlineMath:[["\\(","\\)"]]
  },
  svg:{
    fontCache:"global"
  }
};
</script>

<script async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

</head>
<body style="font-family:Arial,sans-serif;max-width:1050px;margin:20px auto;padding:0 12px;background:#f6f8fb">
<h1>מקלדת לנוסחאות ולמשוואות כימיות — גרסת בדיקה</h1>
<h2>1. מצב עריכה</h2><div id="editor"></div>

<div id="rendered" style="direction:ltr;font-size:32px"></div> 

<button type="button" id="loadWater">טען H₂O</button> 
<br>
<button id="loadIronEquation" type="button">Iron oxide example</button>
<button id="loadIonEquation" type="button">Ionic example</button>
<br>
<button id="submitAnswer" type="button">Submit and check</button>
<div id="checkSummary" dir="ltr"></div>
<div id="checkDetails"></div>
<button type="button" id="copyToReadonly">העבר לתצוגה</button>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr">
<div><b>LaTeX</b><pre id="latex" style="white-space:pre-wrap;background:#fff;padding:8px"></pre></div>
<div><b>AST</b><pre id="ast" style="white-space:pre-wrap;max-height:360px;overflow:auto;padding:8px"></pre></div></div>
<h2>2. מצב קריאה בלבד</h2><div id="readonly" style="display:none"></div>
<h2>3. קריאה בלבד עם הדגשת שגיאות</h2>
<p>בדוגמה מודגשים הסמל והאינדקס השגויים באמצעות טווחי תווים.</p>
<div id="checked" style="display:"></div>
<h2>בדיקת API</h2><pre id="api" style="display:noen; direction:ltr;text-align:left;background:#fff;padding:10px"></pre>
<script src="chemical-keyboard-v3.js"></script>

<script>
var editor=new ChemicalKeyboard({
  divId:"editor",
  language:"he",
  mode:"edit",
  elements:["H","C","N","O","Na","Cl","Ca","Fe","Ag"],
  correctAnswer:"2Fe_{2}O_{3}(s)→4FeO(s)+O_{2}(g)",

  onChange:function(result){
    var preview=document.getElementById("rendered");

    document.getElementById("latex").textContent=result.latex;
    document.getElementById("ast").textContent=JSON.stringify(result.ast,null,2);

    preview.textContent="\\("+result.latex+"\\)";

    if(window.MathJax&&MathJax.startup&&MathJax.startup.promise){
      MathJax.startup.promise.then(function(){
        if(MathJax.typesetClear) MathJax.typesetClear([preview]);
        return MathJax.typesetPromise([preview]);
      });
    }
  }
});

var checkedKeyboard=new ChemicalKeyboard({
  divId:"checked",
  language:"he",
  mode:"readonly-errors",
  value:""
});

document.getElementById("loadIronEquation").addEventListener("click",function(){
  var equation="2Fe_{2}O_{3}(s)→4FeO(s)+O_{2}(g)";
  loadExample( equation);
});

document.getElementById("loadIonEquation").addEventListener("click",function(){
  var equation="Ag^{+}(aq)+Cl^{-}(aq)→AgCl(s)";
  loadExample( equation);
});

function loadExample(equation){
  editor.setCorrectAnswer(equation);
  editor.setValue(equation);

  document.getElementById("checkSummary").textContent="";
  document.getElementById("checkDetails").textContent="";
}


document.getElementById("submitAnswer").addEventListener("click",function(){
  var result=editor.compare();
  checkedKeyboard.setValue(editor.getModel());
  checkedKeyboard.setComparisonResult(result);

  ChemicalGrammar.renderComparison(
    result,
    editor.language,
    document.getElementById("checkSummary"),
    document.getElementById("checkDetails")
  );
});

var readonly=new ChemicalKeyboard({divId:"readonly",language:"he",mode:"readonly",value:"2H_{2}+O_{2}→2H_{2}O"});

document.getElementById("loadWater").addEventListener("click",
function(){loadExample( "H_{2}O");});

document.getElementById("copyToReadonly").addEventListener("click",
function(){readonly.setValue(editor.getModel());});
document.getElementById("api").textContent="getValue()\\ngetModel()\\ngetAST()\\nresult()\\nsetValue(textOrModel)\\nsetMode('edit' | 'readonly' | 'readonly-errors')\\nsetHighlights([{start, end, color}])";
editor.setValue("2Fe_{2}O_{3(s)}→4FeO_{(s)}+O_{2(g)}");

document.getElementById("ast").style.display="none";
document.getElementById("latex").style.display="none";
</script>



<div id="mathjaxPreview"></div>

</body></html>
